[project]
name = "steamstudy"
version = "0.1.0"
description = "Steam Success Study: polite collection, deterministic Build and an offline Tag Network app."
requires-python = ">=3.12,!=3.14.1,<3.15"
dependencies = [
    # The Tag Network app only: exactly what an App Bundle installs (ADR 0001). The pipeline's own
    # dependencies are the `pipeline` group below, installed by default in the developer environment.
    # Any upgrade of dash or dash-ag-grid re-runs the Windows spike checklist first.
    # The graph is drawn by Cytoscape.js, vendored in src/steamstudy/app/assets/ (see the Running Guide).
    "dash>=4.4,<5",
    "dash-ag-grid>=35.3,<36",
    "diskcache>=5.6",
    "multiprocess>=0.70.19",
    "psutil>=7.2",
    # Clustering: both algorithms are always installed; versions pinned for determinism.
    "networkx==3.7",
    "leidenalg==0.12.0",
    "python-igraph==1.0.0",
    # Numerics.
    "numpy>=2.5",
    "scipy>=1.18",
    "scikit-learn>=1.8",
]

[project.scripts]
steamstudy = "steamstudy.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "mypy>=1.20"]
# Collect, Build and the feature analysis (never in an App Bundle).
pipeline = [
    "pandas>=3.0",
    # Choosing App Bundle wheels from uv.lock (wheel tags, markers).
    "packaging>=24",
    # Collection and parsing.
    "requests>=2.34",
    "lxml>=6.0",
    # Report rendering.
    "markdown>=3.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steamstudy"]

[tool.hatch.build.targets.wheel.force-include]
# The User Guide ships as package data for the app's offline "?" help.
"docs/user-guide" = "steamstudy/guide"

[tool.uv]
default-groups = ["dev", "pipeline"]  # `uv sync` installs the pipeline as before
# Spawned background jobs start ~2.5 s slower per job without bytecode (ticket 22 spike).
compile-bytecode = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run as: uv run python -W default -X faulthandler -m pytest   (never -X dev on this machine)
filterwarnings = ["default"]
addopts = "-p no:dash"

[tool.mypy]
python_version = "3.14"
files = ["src/steamstudy"]
ignore_missing_imports = true
warn_unused_ignores = true
