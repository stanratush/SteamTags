# Shared network defaults, read by both the app and the feature-analysis report.

min_games_per_tag = 8
min_shared_games = 8
min_months = 0

hide_genre_tags = true
hide_defining_tag = true

clustering_weight = "shared_games"  # or "lift"
algorithm = "louvain"               # or "leiden"
resolution = 1.0
seed = 20261003

null_replicates = 20                # must be >= 2
noise_seeds = 10                    # must be >= 2

resolution_sweep = [0.50, 0.75, 1.00, 1.25, 1.50]

# Automatic Parameter Selection (the app's Parameter Selection mode and the bundle maker). Hidden tags, the main
# seed, null_replicates and noise_seeds come from the defaults above. Leiden only.
[parameter_selection]
clustering_weight = "lift"   # or "shared_games"
min_months = 0               # 0-60
min_multi_tag_clusters = 3   # 1-10, counted after stability
g_range = [3, 20]            # Parameter Grid: min_games_per_tag
s_range = [2, 12]            # min_shared_games, with s <= g
gamma_step = 0.05            # the γ scan runs from 0 to γ_max(n_e) on this step
scan_seeds = 10
null_replicates = 100        # R, Null Comparison
subsamples = 100             # S, Subsample Stability
workers = 0                  # 0 = os.cpu_count() - 1
# Pair Constraints and tolerance: never in a cache key
tolerance = 0.05
min_retention = 0.50
max_isolated_share = 0.10
min_lcc_share = 0.90
min_comparable_neighbours = 2
max_multi_tag_clusters = 0   # 0 = off
