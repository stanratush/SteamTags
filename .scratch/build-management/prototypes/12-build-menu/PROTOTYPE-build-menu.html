<!doctype html>
<!--
  PROTOTYPE, throwaway (2026-11-07). Map: .scratch/build-management. Ticket: 12 Build menu.
  Question: "How does the Build menu look and behave?"
  Three structurally different answers over the same in-memory model, switchable with ?variant=A|B|C and the bar at the
  bottom (or the <- -> keys when no field has focus).
    A  Builds mode          - a fourth header mode. A list of Builds and Build Drafts on the left, the chosen one on the
                              right: a Build's facts and actions, or a draft's long form in three sections with a fixed
                              footer (Top-N changes, Eligible Pool sizes, Build button).
    B  Switcher + dialog    - the Build name in the header is a dropdown (switch, new, duplicate, drafts, manage). A
                              draft opens a full-screen stepped dialog ending in a Review step. A running Build shows as a
                              strip under the header in every mode.
    D  CHOSEN (2026-11-07): B, with the dropdown and Manage dialog drawn as C's lineage tree.
    C  Lineage page        - a page before the Workbench (/builds): every Build and draft in a tree by parent; a draft
                              opens a diff editor, one row per setting with its source value beside the draft's value,
                              plus a pipeline view of a running Build.
  Real data (read 2026-11-07): the three Builds on disk with their sizes, dataset sizes and Eligible Pools from
  build.json, exclusion counts and would-be ranks from reports/exclusions.csv, config/*.toml values, bundles/ names.
  Marked (demo): one menu-made Build and two drafts that exist only here.
  Prototype shortcuts: Eligible Pool sizes after an edit are ESTIMATES (base pool + games the edited rules excluded,
  overlap ignored); a Build run is simulated 8x faster than the measured 99 s raw / 24 s lightweight; nothing is
  written anywhere; Bulgarian covers the menu chrome, not every rule label. The state box shows the full model.
  Run: double-click.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build menu prototype</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6eb;--line2:#eef0f3;--ink:#1b2130;--ink2:#3d4555;--mute:#6b7280;--faint:#9aa1ad;
 --acc:#2457d6;--acc-bg:#eef3ff;--warn:#9a5b00;--warn-bg:#fff6e5;--bad:#b42318;--bad-bg:#fef3f2;--ok:#067647;--ok-bg:#ecfdf3;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}.mute{color:var(--mute)}.small{font-size:11.5px}.faint{color:var(--faint)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}

.btn.danger{color:var(--bad);border-color:#f3c3be}.btn.quiet{border-color:transparent;background:none;color:var(--mute)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--ink);color:#fff}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff}
input.bad,textarea.bad{border-color:var(--bad);background:var(--bad-bg)}
textarea{width:100%;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11.5px;background:#fff;white-space:nowrap}
.chip.topn{border-color:#dcc2ea;background:var(--topn-bg);color:var(--topn)}
.chip.run{border-color:#b9cbf5;background:var(--acc-bg);color:var(--acc)}
.chip.fail{border-color:#f3c3be;background:var(--bad-bg);color:var(--bad)}
.chip.ok{border-color:#abefc6;background:var(--ok-bg);color:var(--ok)}
.chip.demo{border-color:#f5d68a;background:#fffbeb;color:#92400e}
.chip.open{border-color:var(--ink);background:var(--ink);color:#fff}

.failbox{color:var(--bad);background:var(--bad-bg);border:1px solid #f3c3be;border-radius:6px;padding:6px 9px}
.h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin:16px 0 6px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:11px;color:var(--mute);font-weight:600}
.field{display:grid;grid-template-columns:180px 1fr;gap:4px 12px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line2)}
.field>label{color:var(--ink2);padding-top:3px}.field .hint{grid-column:2;font-size:11.5px;color:var(--mute)}
.field.changed>label::before{content:"●";color:var(--acc);margin-right:4px;font-size:10px}
.rule{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:#fff}
.rule.fixed{background:#fafbfc;color:var(--mute)}
.rule .rh{display:flex;gap:8px;align-items:center}
.tagchip{display:inline-flex;align-items:center;gap:3px;background:#f1f3f6;border-radius:4px;padding:0 5px;margin:2px 3px 2px 0;font-size:12px}
.tagchip button{border:0;background:none;cursor:pointer;color:var(--mute);padding:0}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
/* ---------------- app frame (mock of the real header) */
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}.brand b{font-size:14px}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ptag{background:#fde68a;color:#713f12;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
#body{flex:1;min-height:0;position:relative;overflow:hidden}
/* fake workbench */
.wb{position:absolute;inset:0;display:grid;grid-template-columns:264px 1fr 300px}
.wb .p{background:var(--panel);border-right:1px solid var(--line);padding:12px}
.wb .g{position:relative;background:#fbfbfc;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.wb .sk{height:9px;background:#eef0f3;border-radius:4px;margin:10px 0}
.blob{position:absolute;border-radius:50%;opacity:.35}
/* state box */
#state{position:fixed;left:10px;bottom:10px;z-index:60;background:#111827eb;color:#e5e7eb;font:11px/1.35 var(--mono);border-radius:8px;padding:6px 8px;max-width:420px;max-height:46vh;overflow:auto}
#state summary{cursor:pointer;color:#fde68a}#state pre{margin:4px 0 0;white-space:pre-wrap}
#state .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}#state button{font:11px var(--mono);background:#374151;color:#e5e7eb;border:0;border-radius:4px;padding:2px 6px;cursor:pointer}
#state button.on{background:#fde68a;color:#111}
/* switcher */
#switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:6px;background:#111827;color:#fff;border-radius:999px;padding:5px 8px;box-shadow:0 4px 16px #0005;font-size:12px}
#switcher button{background:#374151;color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
#switcher span{padding:0 6px;min-width:230px;text-align:center}
/* modal + toast */
.scrim{position:fixed;inset:0;background:#0f172a66;z-index:80;display:flex;align-items:center;justify-content:center}
.dlg{background:#fff;border-radius:10px;box-shadow:0 12px 40px #0004;width:min(560px,92vw);max-height:86vh;overflow:auto;padding:16px 18px}
.dlg h3{margin:0 0 8px;font-size:15px}.dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;right:16px;bottom:64px;z-index:90;background:#111827;color:#fff;border-radius:8px;padding:8px 12px;max-width:360px;display:none}
/* ---------------- Variant A */
.A-wrap{position:absolute;inset:0;display:grid;grid-template-columns:360px 1fr}
.A-list{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 12px 80px}
.A-item{border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;margin:2px 0}
.A-item:hover{background:#f7f8fa}.A-item.sel{border-color:var(--acc);background:var(--acc-bg)}
.A-item .t{display:flex;gap:6px;align-items:center}.A-item .t b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.A-main{display:flex;flex-direction:column;min-height:0}
.A-scroll{flex:1;overflow:auto;padding:14px 22px 30px}
.A-nav{display:flex;gap:4px;position:sticky;top:-14px;background:var(--bg);padding:8px 0;z-index:3;border-bottom:1px solid var(--line)}
.A-nav a{padding:3px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;cursor:pointer}.A-nav a:hover{background:#fff}
.A-sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 16px 14px;margin:14px 0}

.B-strip.ok{background:var(--ok-bg);border-color:#abefc6;color:var(--ok)}
.B-dlg{position:fixed;inset:24px 40px;z-index:85;background:#fff;border-radius:12px;box-shadow:0 20px 60px #0005;display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden}
.B-dlg .hd{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.B-steps{background:#fafbfc;border-right:1px solid var(--line);padding:12px 0}
.B-steps div{padding:7px 18px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--ink2)}
.B-steps div.on{background:var(--acc-bg);color:var(--acc);font-weight:600;border-right:3px solid var(--acc)}
.B-steps .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.B-steps .n.done{background:var(--ok);border-color:var(--ok);color:#fff}.B-steps .n.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.B-cnt{overflow:auto;padding:14px 24px}
.B-ft{grid-column:1/3;border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;align-items:center}
.diffrow td.old{color:var(--mute);text-decoration:line-through}.diffrow td.new{color:var(--ink);font-weight:500}
/* ---------------- Variant C */
.C-page{position:absolute;inset:0;display:grid;grid-template-columns:minmax(420px,44%) 1fr}
.C-tree{overflow:auto;padding:14px 16px 80px;border-right:1px solid var(--line);background:#fff}
.C-node{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;position:relative}
.C-node:hover{background:#f7f8fa}.C-node.sel{background:var(--acc-bg);outline:1px solid var(--acc)}
.C-node .ln{color:var(--faint);font-family:var(--mono);white-space:pre}
.C-node .meta{grid-column:2/4;font-size:11.5px;color:var(--mute)}
.C-node .acts{display:none;gap:4px}.C-node:hover .acts,.C-node.sel .acts{display:flex}
.C-right{overflow:auto;padding:14px 20px 80px}
.C-diff td{padding:3px 6px}.C-diff tr.chg{background:#f4f7ff}.C-diff tr.sec td{background:#f5f6f8;font-weight:600;font-size:12px;padding-top:10px}
.C-diff td.src{color:var(--mute);font-family:var(--mono);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.C-diff td.cur input[type=text]{width:100%}
.pipe{display:flex;gap:2px;margin:8px 0}.pipe div{flex:var(--w);padding:6px 6px;font-size:11.5px;background:var(--line2);border-radius:4px;position:relative;overflow:hidden;min-width:0;white-space:nowrap}
.pipe div i{position:absolute;inset:0;width:var(--p);background:#c9d8fb;z-index:0}.pipe div span{position:relative}
.pipe div.done{background:#c9d8fb}.pipe div.fail{background:var(--bad-bg);color:var(--bad)}
</style>

/* ============================================================ model */
const S={
 v:"A", lang:"en",

 ],

 ui:{A:{sec:"topn"}, B:{menu:false,dlg:null,step:0,manage:false}, C:{changedOnly:false}},

const bkey=b=>b.snap+"/"+b.id;
const findBuild=k=>S.builds.find(b=>bkey(b)===k);
const findDraft=id=>S.drafts.find(d=>d.id===id);
const openBuild=()=>findBuild(S.open);
const snapShort=s=>s.endsWith("-test")?"test · "+s.slice(0,8):"full · "+s.slice(0,8);

function sourceSettings(d){if(!d.parent)return DEFAULT_SETTINGS;const p=findBuild(d.parent);return p?p.settings:DEFAULT_SETTINGS}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function changedKeys(d){const src=sourceSettings(d);return [...TOPN_KEYS,...REPORT_KEYS,...NET_KEYS].filter(k=>!same(d.settings[k],src[k]))}
function pools(d){
 const base=d.snap===TEST?TEST_POOL:BASE_POOL, ruleCodes=new Set(d.settings.rules.map(r=>r.code));
 let extra=0;for(const c of ["adult_content","software_tag","dating_sim_tag"])if(!ruleCodes.has(c))extra+=RULE_EXCLUDED[c];
 const added=d.settings.rules.filter(r=>!DEFAULT_SETTINGS.rules.some(x=>x.code===r.code)).length;
 const srcRules=DEFAULT_SETTINGS.rules;let tagDelta=0;
 d.settings.rules.forEach(r=>{const s=srcRules.find(x=>x.code===r.code);if(s)tagDelta+=r.tags.length-s.tags.length});
 const est=extra||added||tagDelta||d.settings.manual_exclusions.length||d.settings.overrides.length||d.settings.manual_metadata.length;
 const out={};
 d.settings.datasets.forEach(ds=>{const b=base[ds.key]??Math.round(base.overall*0.2), f=b/base.overall;
  let n=b+Math.round(extra*f)-Math.round(tagDelta*40*f)-Math.round(added*120*f)-d.settings.manual_exclusions.length+d.settings.overrides.length+d.settings.manual_metadata.length;
  out[ds.key]={pool:n,list:ds.list_size,est:!!est,bad:n<ds.list_size}});
 return out;
}
function entering(d){ // games that would enter the Overall list from the would-be ranks
 const codes=new Set(d.settings.rules.map(r=>r.code)), ov=d.settings.overrides, man=new Set(d.settings.manual_exclusions.map(m=>m.appid));
 const md=new Set(d.settings.manual_metadata.map(m=>m.appid)), n=(d.settings.datasets.find(x=>x.key==="overall")||{}).list_size||100;
 return EXCLUDED_TOP.filter(g=>!man.has(g.appid)&&g.rank<=n&&g.rules.every(r=>
   r==="store_data_unavailable"?md.has(g.appid):r==="app_type"?false:(!codes.has(r)||ov.some(o=>o.appid===g.appid&&o.rule===r))));
}
function leaving(d){return d.settings.manual_exclusions.map(m=>m.name||String(m.appid))}
function entryErrors(e,kind,d){
 const er=[];if(!e.appid)er.push("AppID required");if(!e.reason||!e.reason.trim())er.push("reason required");
 if(!e.evidence||!e.evidence.length||!e.evidence.every(x=>/^https?:\/\//.test(x.url||"")&&x.retrieved))er.push("evidence: a URL and a retrieved date");
 if(kind==="override"&&!d.settings.rules.some(r=>r.code===e.rule))er.push(`rule “${e.rule}” is not a rule of this draft`);
 return er;
}
function validate(d){
 const v={fields:{},count:0}, add=(k,m)=>{(v.fields[k]=v.fields[k]||[]).push(m);v.count++};
 if(!d.name.trim())add("name","A name is required.");
 const clash=[...S.builds.filter(b=>b.snap===d.snap).map(b=>b.name),...S.drafts.filter(x=>x.snap===d.snap&&x.id!==d.id).map(x=>x.name)]
   .some(n=>n.toLowerCase()===d.name.trim().toLowerCase());
 if(d.name.trim()&&clash)add("name","Another Build or draft of this Snapshot has this name.");
 if(!d.desc.trim())add("desc","A description is required: it becomes this Build’s changelog entry.");
 const td=d.settings.tag_depth;if(td!=="all"&&!(Number.isInteger(td)&&td>=2&&td<=20))add("tag_depth","An integer from 2 to 20, or all.");
 const p=pools(d);d.settings.datasets.forEach(ds=>{if(!(ds.list_size>=10))add("ds_"+ds.key,"At least 10.");
  else if(p[ds.key].bad)add("ds_"+ds.key,`The Eligible Pool (${p[ds.key].pool}) is smaller than ${ds.list_size}: the Build would fail.`)});
 d.settings.rules.forEach((r,i)=>{if(!r.label.trim())add("rule_"+i,"A label is required.");if(!r.tags.length&&!r.name_only.length&&!r.descriptor_ids.length&&!r.adult_only_notice)add("rule_"+i,"The rule matches nothing.")});
 [["manual_exclusions","exclusion"],["overrides","override"],["manual_metadata","metadata"]].forEach(([k,kind])=>d.settings[k].forEach((e,i)=>entryErrors(e,kind,d).forEach(m=>add(k+"_"+i,m))));
 return v;
}
function identicalTo(d){const h=JSON.stringify(d.settings);return S.builds.find(b=>b.snap===d.snap&&JSON.stringify(b.settings)===h)}
function fmtVal(k,v){if(v==null)return"—";if(k==="datasets")return v.map(x=>`${x.label} ${x.list_size}`).join(", ");
 if(k==="rules"||k==="content_flags")return v.map(x=>x.label).join(", ")||"none";
 if(Array.isArray(v)){if(v.length&&typeof v[0]==="object")return v.length?`${v.length} entr${v.length>1?"ies":"y"}`:"none";return v.length?v.join(", "):"none"}
 return String(v)}

/* ============================================================ actions */
let toastT;function toast(m){const t=document.getElementById("toast");t.innerHTML=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",3800)}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9а-я]+/g,"-").replace(/^-|-$/g,"")}
function newDraft(fromKey,snap){const b=fromKey?findBuild(fromKey):null;
 const base=b?b.name:"config defaults";let name=b?`${b.name} (copy)`:"New Build",i=2;
 while(S.drafts.some(d=>d.name===name)||S.builds.some(x=>x.name===name))name=(b?`${b.name} (copy ${i})`:`New Build ${i}`),i++;
 const d={id:"d"+Date.now().toString(36),snap:snap||(b?b.snap:openBuild().snap),name,desc:"",parent:b?fromKey:null,settings:clone(b?b.settings:DEFAULT_SETTINGS),saved:nowStr(),failure:null};
 S.drafts.unshift(d);S.sel={kind:"draft",key:d.id};toast(`Draft “${esc(name)}” started from ${esc(base)}. ${T("Saved automatically")}.`);return d}
function nowStr(){const n=new Date();return n.toISOString().slice(0,10)+" "+n.toTimeString().slice(0,5)}
function touch(d){d.saved=nowStr()}
function askSwitch(key){if(key===S.open)return;const b=findBuild(key);
 if(S.tabJobs.length)S.dialog={kind:"switch",key};else doSwitch(key);}
function doSwitch(key){S.open=key;S.tabJobs=[];S.dialog=null;S.ui.B.menu=false;const b=findBuild(key);
 toast(`Tab navigated to <span class="mono">/build/${esc(b.snap)}/${esc(b.id)}</span>. Language, mode and same-named dataset kept; Network State reset to this Build’s defaults.`);
 if(S.v==="C")S.ui.C.page="wb";}
function askDelete(key){S.dialog={kind:"delete",key}}
function doDelete(key){const b=findBuild(key);S.builds=S.builds.filter(x=>x!==b);
 if(b.latest){const rest=S.builds.filter(x=>x.snap===b.snap).sort((a,c)=>c.id.localeCompare(a.id));if(rest[0])rest[0].latest=true}
 if(S.run&&false){}S.dialog=null;if(S.sel&&S.sel.key===key)S.sel=null;toast(`Deleted “${esc(b.name)}”: folder and app cache removed.`)}
function discard(id){S.drafts=S.drafts.filter(d=>d.id!==id);if(S.sel&&S.sel.key===id)S.sel=null;S.dialog=null;S.ui.B.dlg=null;toast("Draft discarded (its failed/ file too).")}
function startRun(id){const d=findDraft(id);if(S.run){toast("A Build is already running on this app process: one at a time.");return}
 const v=validate(d);if(v.count){toast(`Fix ${v.count} problem${v.count>1?"s":""} first.`);return}
 const sn=SNAPSHOTS.find(s=>s.id===d.snap);d.failure=null;
 S.run={draftId:id,t:0,secs:sn.buildSecs.lightweight,form:"lightweight",fail:S.nextFail};S.nextFail=null;render();}
const STAGES=[{k:"read",l:"Read Snapshot",w:.35},{k:"topn",l:"Exclusions + Top-N",w:.2},{k:"analysis",l:"Feature analysis",w:.18},{k:"net",l:"Network",w:.17},{k:"rep",l:"Reports",w:.1}];
function stageAt(r){let f=r.t/r.secs,acc=0;for(let i=0;i<STAGES.length;i++){acc+=STAGES[i].w;if(f<=acc+1e-9)return{i,f}}return{i:STAGES.length-1,f:1}}
setInterval(()=>{if(!S.run)return;const r=S.run;r.t+=0.25*8; // 8x faster: 4 ticks/s, 2 simulated s per tick
 const failAt=r.fail==="parse"?r.secs*.3:r.fail==="causal"?r.secs*.96:null;const d=findDraft(r.draftId);
 if(failAt&&r.t>=failAt){d.failure=r.fail==="parse"?{kind:"parse",count:3,file:`failed/${nowStr().replace(/\D/g,"").slice(0,8)}T…-parse_errors.csv`}
   :{kind:"causal",word:"drives",sentence:"Co-op survival drives the Crafting cluster…",file:"reports.html"};d.failNew=true;S.run=null;toast(`Build of “${esc(d.name)}” failed. The draft keeps its settings.`);render();return}
 if(r.t>=r.secs){const id=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z-"+Math.random().toString(16).slice(2,10);
   const p=pools(d);S.builds.push({snap:d.snap,id,name:d.name.trim(),desc:d.desc.trim(),parent:d.parent,created:nowStr().slice(0,10),sizeMB:8.8,cacheMB:0,form:r.form,settings:clone(d.settings),bundles:[],software:"0.1.0",demo:true,justMade:true});
   S.builds.filter(b=>b.snap===d.snap).forEach(b=>b.latest=false);S.builds[S.builds.length-1].latest=true;
   S.drafts=S.drafts.filter(x=>x!==d);S.run=null;S.sel={kind:"build",key:d.snap+"/"+id};S.lastMade=d.snap+"/"+id;
   if(S.ui.B.dlg===d.id)S.ui.B.dlg=null;toast(`Built “${esc(d.name)}”. Its draft is used up.`);}
 render();},250);

/* ============================================================ shared field atoms (layouts differ per variant) */
const errs=(v,k)=>(v.fields[k]||[]).map(m=>`<div class="err">${esc(m)}</div>`).join("");
function ruleCard(d,r,i,v){
 const td=(t,j)=>`<span class="tagchip">${esc(t.name)} <span class="faint mono">${t.id}</span>${t.limit?` <span class="chip">≤ ${t.limit}</span>`:""}<button data-act="rmtag" data-i="${i}" data-j="${j}" title="${T("Remove")}">×</button></span>`;
 return `<div class="rule"><div class="rh"><span class="mono faint">${i+1}.</span>
  <input type="text" value="${esc(r.label)}" data-bind="rules.${i}.label" class="${v.fields["rule_"+i]?"bad":""}" style="width:200px">
  <span class="mono faint small">${esc(r.code)}</span><span style="flex:1"></span>
  <button class="btn quiet" data-act="ruleup" data-i="${i}" ${i?"":"disabled"}>↑</button><button class="btn quiet" data-act="ruledn" data-i="${i}" ${i<d.settings.rules.length-1?"":"disabled"}>↓</button>
  <button class="btn quiet" data-act="rmrule" data-i="${i}">${T("Remove")}</button></div>
  <div style="margin:4px 0 0 18px"><span class="small mute">tags</span> ${r.tags.map(td).join("")}
   <input type="text" placeholder="+ tag (name or id)" data-addtag="${i}" style="width:150px">
   ${r.name_only.length?`<div><span class="small mute">name only</span> ${r.name_only.map(n=>`<span class="tagchip">${esc(n)}</span>`).join("")}</div>`:""}
   ${d.snap?`<div class="small"><span class="mute">Steam:</span> content descriptor ids <input type="text" value="${r.descriptor_ids.join(", ")}" data-bind="rules.${i}.descriptor_ids" data-type="ints" style="width:70px">
   <label><input type="checkbox" ${r.adult_only_notice?"checked":""} data-bind="rules.${i}.adult_only_notice" data-type="bool"> Adult Only notice</label>
   <span class="mute">· excluded ${RULE_EXCLUDED[r.code]??"?"} games in the source Build</span></div>`:""}
   ${errs(v,"rule_"+i)}</div></div>`;
}
function rulesBlock(d,v){
 const fixed=t=>`<div class="rule fixed"><span class="mono faint">·</span> ${t} <span class="chip">${T("fixed rule")}</span></div>`;
 return fixed(`App type is not <span class="mono">${d.settings.allowed_app_types.join(", ")}</span> · no store data · no tags`)+
  d.settings.rules.map((r,i)=>ruleCard(d,r,i,v)).join("")+
  `<button class="btn" data-act="addrule">+ ${T("Add")} rule</button>`+fixed(T("Manual Exclusions")+" (always last)");
}
function datasetsBlock(d,v,compact){
 const p=pools(d);
 return `<table><tr><th>Dataset</th><th>Defining tag</th><th>${T("List size")}</th><th>${T("Eligible Pool")}</th></tr>`+
  d.settings.datasets.map(ds=>`<tr><td>${esc(ds.label)}</td><td>${ds.defining_tag?esc(ds.defining_tag.name)+` <span class="faint mono">${ds.defining_tag.id}</span>`:"<span class='mute'>none</span>"}</td>
   <td><input type="number" min="10" value="${ds.list_size}" data-ds="${ds.key}" style="width:70px" class="${v.fields["ds_"+ds.key]?"bad":""}">${errs(v,"ds_"+ds.key)}</td>
   <td>${poolChip(p[ds.key])}</td></tr>`).join("")+`</table>`;

function poolChip(x){return `<span class="pool ${x.bad?"bad":""} ${x.est?"est":""}" title="${x.est?"Estimate in this prototype; the real menu computes it from the lightweight Snapshot":"From the source Build"}">${x.est?"≈ ":""}${x.pool.toLocaleString("en")}</span>`}
function tagDepthBlock(d,v){const td=d.settings.tag_depth;
 return `<span class="seg"><button data-act="td" data-v="num" class="${td!=="all"?"on":""}">first</button><button data-act="td" data-v="all" class="${td==="all"?"on":""}">${T("all")}</button></span>

function entriesBlock(d,v,k){
 const kind={manual_exclusions:"exclusion",overrides:"override",manual_metadata:"metadata"}[k];
 const rows=d.settings[k].map((e,i)=>{const bad=v.fields[k+"_"+i];return `<div class="rule" style="${bad?"border-color:#f3c3be":""}">

  ${kind==="metadata"?`<select data-bind="${k}.${i}.kind"><option ${e.kind==="full"?"selected":""}>full</option><option ${e.kind==="tags_only"?"selected":""}>tags_only</option></select>`:""}

  <button class="btn quiet small" data-act="addev" data-k="${k}" data-i="${i}">+ ${T("evidence")}</button>

  ${(bad||[]).map(m=>`<div class="err">${esc(m)}</div>`).join("")}</div>`}).join("");

 fieldRow(d,"ps_weight",selField(d,"ps_weight",["lift","shared_games"]))+fieldRow(d,"ps_g_range",rangeField(d,"ps_g_range"),"Whether the grid scales with list size and Tag Depth is ticket 11.")+fieldRow(d,"ps_s_range",rangeField(d,"ps_s_range"))+
 fieldRow(d,"ps_null_replicates",numField(d,"ps_null_replicates"))+fieldRow(d,"ps_subsamples",numField(d,"ps_subsamples"))}
function topnFields(d,v){return `<div class="h">${T("Datasets")} · ${T("List size")}</div>${datasetsBlock(d,v)}

function lineage(k){if(!k)return `<span class="mute">config defaults</span>`;const p=findBuild(k);return p?`${T("from")} “${esc(p.name)}”`:`<span class="mute">${T("from")} a deleted Build</span>`}
function statusChips(d){const parts=[];if(S.run&&S.run.draftId===d.id)parts.push(`<span class="chip run">${T("running")} ${Math.round(100*S.run.t/S.run.secs)}%</span>`);

function buildChips(b){const p=[];if(bkey(b)===S.open)p.push(`<span class="chip open">${T("open in this tab")}</span>`);if(b.latest)p.push(`<span class="chip">latest</span>`);

    <div class="h">${T("Eligible Pool")} and Top-N</div><table><tr><th>Dataset</th><th>${T("List size")}</th><th>${T("Eligible Pool")}</th></tr>${d.settings.datasets.map(ds=>`<tr><td>${esc(ds.label)}</td><td>${ds.list_size}</td><td>${poolChip(p[ds.key])}</td></tr>`).join("")}</table>
    ${ent.length?`<p>Enters the Overall list: ${ent.map(g=>`<b>${esc(g.name)}</b> (#${g.rank})`).join(", ")}</p>`:""}
    ${identWarn(d)}${v.count?`<div class="failbox">${v.count} problem${v.count>1?"s":""}: ${Object.values(v.fields).flat().slice(0,4).map(esc).join(" · ")}</div>`:""}${runBox(d)}`}
  dlg=`<div class="scrim" style="background:#0f172a40"></div><div class="B-dlg"><div class="hd"><b style="font-size:15px">${esc(d.name)||"unnamed"}</b> ${statusChips(d)}<span class="small mute">${T("Saved automatically")} ${d.saved}</span><span style="flex:1"></span>

  <div class="act"><button class="btn" data-act="Bmanageclose">Close</button></div></div></div>`}

/* ============================================================ Variant D: B with C's lineage tree (the chosen design) */
// mode "menu": the header dropdown (click a Build = switch, a draft = open its dialog); "manage": the Manage dialog, with sizes.
function lineageTree(mode){
 const kids=k=>[...S.builds.filter(b=>b.parent===k).map(b=>({t:"b",o:b,k:bkey(b)})),...S.drafts.filter(d=>d.parent===k).map(d=>({t:"d",o:d,k:d.id}))];
 const rootKids=sn=>[...S.builds.filter(b=>b.snap===sn&&(!b.parent||!findBuild(b.parent))).map(b=>({t:"b",o:b,k:bkey(b)})),
  ...S.drafts.filter(d=>d.snap===sn&&(!d.parent||!findBuild(d.parent))).map(d=>({t:"d",o:d,k:d.id}))];
 function node(n,prefix,last){const conn=prefix+(last?"└─ ":"├─ "),next=prefix+(last?"   ":"│  "),o=n.o;
  const head=n.t==="b"?`<span style="width:12px;display:inline-block">${n.k===S.open?"✓":""}</span><b>${esc(o.name)}</b> ${buildChips(o)}`
   :`<span style="width:12px;display:inline-block"></span>✎ <i>${esc(o.name)||"unnamed"}</i> ${statusChips(o)}`;
  const gone=o.parent&&!findBuild(o.parent)?" · from a deleted Build":"";
  const meta=n.t==="b"?`${o.created} · ${datasetSummary(o)}${mode==="manage"?` · ${o.sizeMB} MB, cache ${o.cacheMB} MB`:""}${gone}`
   :`${changedKeys(o).length} changed · saved ${o.saved}${S.run&&S.run.draftId===o.id?` · building ${Math.round(100*S.run.t/S.run.secs)}%`:""}${gone}`;
  const acts=n.t==="b"?`<button class="btn quiet small" data-act="dup" data-k="${esc(n.k)}" title="${T("Duplicate")}">⧉</button><button class="btn quiet small" data-act="del" data-k="${esc(n.k)}" title="${T("Delete")}">🗑</button>`
   :`<button class="btn quiet small" data-act="discard" data-id="${o.id}" title="${T("Discard draft")}">×</button>`;
  const act=n.t==="b"?`data-act="switch" data-k="${esc(n.k)}"`:`data-act="Bedit" data-id="${o.id}"`;
  return `<div class="C-node" ${act}><span class="ln">${conn}</span><div>${head}</div><div class="acts">${acts}</div><div class="meta" style="padding-left:${conn.length*0.6}em">${meta}</div></div>`+
   (n.t==="b"?kids(n.k):[]).map((c,i,a)=>node(c,next,i===a.length-1)).join("");}
 return SNAPSHOTS.map(sn=>{const ks=rootKids(sn.id);return `<div class="grp">${T("Snapshot")} <span class="mono" style="text-transform:none">${esc(snapShort(sn.id))}</span></div>
  <div class="C-node" data-act="Dnew" data-snap="${sn.id}"><span class="ln"></span><div><span class="mono">config/</span> <span class="mute">defaults · + ${T("New Build")}</span></div><div></div></div>`+
  ks.map((c,i)=>node(c,"",i===ks.length-1)).join("")}).join("");
}

   ch.map((c,i)=>node(c,next,i===ch.length-1)).join("");}
 const tree=SNAPSHOTS.map(sn=>{const ks=rootKids(sn.id);return `<div class="h">${T("Snapshot")} <span class="mono" style="text-transform:none">${esc(sn.id)}</span> <span style="text-transform:none;letter-spacing:0">· ${sn.forms.join(" + ")} · Build ~${sn.buildSecs.lightweight} s</span></div>

  ks.map((c,i)=>node(c,"",i===ks.length-1)).join("")}).join("");

 if(sel&&sel.kind==="build"){const b=findBuild(sel.key);if(b){const src=b.parent?findBuild(b.parent):null;const ss=src?src.settings:DEFAULT_SETTINGS;
  const diffs=[...TOPN_KEYS,...REPORT_KEYS,...NET_KEYS].filter(k=>!same(b.settings[k],ss[k]));
  right=`<h2 style="margin:2px 0">${esc(b.name)} ${buildChips(b)}</h2><div class="mono small mute">${esc(b.snap)}/${esc(b.id)}</div><p>${esc(b.desc)}</p>
   <div style="display:flex;gap:6px"><button class="btn primary" data-act="switch" data-k="${esc(sel.key)}" ${sel.key===S.open?"disabled":""}>${T("Open")}</button><button class="btn" data-act="Cdup" data-k="${esc(sel.key)}">${T("Duplicate")}</button><button class="btn danger" data-act="del" data-k="${esc(sel.key)}">${T("Delete")}…</button></div>
   <div class="h">Differs from ${src?`“${esc(src.name)}”`:"config defaults"}</div>${diffs.length?`<table class="C-diff">${diffs.map(k=>`<tr><td>${TOPN_KEYS.includes(k)?'<span class="chip topn">Top-N</span>':""}</td><td>${esc(LABEL[k])}</td><td class="src">${esc(fmtVal(k,ss[k]))}</td><td>${esc(fmtVal(k,b.settings[k]))}</td></tr>`).join("")}</table>`:"<p class='mute'>Nothing: same settings.</p>"}
   <div class="h">Bundles</div>${b.bundles.length?b.bundles.map(x=>`<div class="mono small">${esc(x)}</div>`).join(""):"<span class='mute'>none</span>"}`}}
 if(sel&&sel.kind==="draft"){const d=findDraft(sel.key);if(d){const v=validate(d),src=sourceSettings(d),p=pools(d),ent=entering(d);
  const row=(k,ctl)=>{const ch=!same(d.settings[k],src[k]);if(ui.changedOnly&&!ch)return"";
   return `<tr class="${ch?"chg":""}"><td>${TOPN_KEYS.includes(k)?'<span class="chip topn">Top-N</span>':""}</td><td>${esc(LABEL[k])}${ch?` <button class="btn quiet small" data-act="Creset" data-key="${k}" title="Back to the source value">↺</button>`:""}</td><td class="src" title="${esc(fmtVal(k,src[k]))}">${esc(fmtVal(k,src[k]))}</td><td class="cur">${ctl}</td></tr>`};

   if(Array.isArray(x)&&k.startsWith("ps_"))return rangeField(d,k);if(k==="causal_words")return `<input type="text" value="${esc(x.join("; "))}" data-bind="${k}" data-type="list">`;

function render(){

 document.getElementById("app").innerHTML=VARIANTS[S.v][1]()+dialogHtml();

 const sc2=document.querySelector("."+cls.split(" ")[0]);if(sc2&&cls)sc2.scrollTop=top;
 if(lastFocus){const sel=lastFocus.b?`[data-bind="${lastFocus.b}"]`:lastFocus.ds?`[data-ds="${lastFocus.ds}"]`:`[data-addtag="${lastFocus.at}"]`;const el=document.querySelector(sel);
  if(el){el.focus();try{if(lastFocus.s!=null)el.setSelectionRange(lastFocus.s,lastFocus.s)}catch(e){}}}

  builds:S.builds.map(b=>({key:bkey(b),name:b.name,parent:b.parent,latest:!!b.latest})),
  drafts:S.drafts.map(d=>({id:d.id,name:d.name,parent:d.parent,changed:changedKeys(d),problems:validate(d).count,failure:d.failure&&d.failure.kind,pools:Object.fromEntries(Object.entries(pools(d)).map(([k,x])=>[k,(x.est?"≈":"")+x.pool]))}))};
 document.getElementById("statepre").textContent=JSON.stringify(view,null,1);
 document.getElementById("statectl").innerHTML=`next run: ${[["ok",null],["parse fails","parse"],["causal fails","causal"]].map(([l,v])=>`<button data-sc="${v}" class="${S.nextFail===v?"on":""}">${l}</button>`).join("")}
  <button data-sc2="job">${S.tabJobs.length?"stop":"start"} a tab job</button><button data-sc2="gone">open a deleted Build URL</button>`;
}
function draftOfView(){if((S.v==="B"||S.v==="D")&&S.ui.B.dlg)return findDraft(S.ui.B.dlg);if(S.sel&&S.sel.kind==="draft")return findDraft(S.sel.key);return null}
function setPath(obj,path,val){const ps=path.split(".");let o=obj;for(let i=0;i<ps.length-1;i++)o=o[ps[i]];o[ps[ps.length-1]]=val}
function parse(type,el){const x=el.value;if(type==="bool")return el.checked;if(type==="int")return x===""?null:parseInt(x,10);if(type==="num")return x===""?null:Number(x);
 if(type==="ints")return x.split(/[,\s]+/).filter(Boolean).map(Number);if(type==="nums")return x.split(/[,;\s]+/).filter(Boolean).map(Number);if(type==="list")return x.split(";").map(s=>s.trim()).filter(Boolean);return x}
document.addEventListener("input",e=>{const el=e.target,d=draftOfView();if(!d)return;
 if(el.dataset.bind){const p=el.dataset.bind;const val=parse(el.dataset.type,el);
