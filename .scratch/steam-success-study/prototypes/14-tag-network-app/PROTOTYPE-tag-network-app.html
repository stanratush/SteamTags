<script>
// ============================================================ mock data
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

const GENRE_TAGS=['Action','Adventure','Casual','Experimental','Puzzle','Racing','RPG','Simulation','Sports','Strategy','Tabletop'];
const GENERIC={Singleplayer:.75,Multiplayer:.5,Action:.45,Indie:.3,Atmospheric:.35,'3D':.4,'Great Soundtrack':.3,'Early Access':.08,'Co-op':.3,
  'Online Co-Op':.22,PvP:.18,'Open World':.22,Adventure:.4,'Story Rich':.22,Colorful:.15,Funny:.15,Difficult:.18,'Replay Value':.2,Realistic:.15,
  Fantasy:.2,'Sci-fi':.15,'First-Person':.22,'Third Person':.22,Controller:.3,Moddable:.1,Exploration:.22,Casual:.18,Simulation:.15,Strategy:.12,RPG:.2};
const ARCH={
  shooter:{FPS:.9,Shooter:.95,'First-Person':.8,Tactical:.4,Military:.4,'Team-Based':.5,Competitive:.5,PvP:.7,'Hero Shooter':.2,'Battle Royale':.25,'Looter Shooter':.15,War:.3,Gore:.3,Violent:.3,Realistic:.3,Action:.9},
  survival:{Survival:.95,Crafting:.9,'Open World Survival Craft':.8,'Base Building':.7,Sandbox:.7,Building:.5,'Open World':.7,'Co-op':.6,'Online Co-Op':.5,Exploration:.7,'Post-apocalyptic':.3,Zombies:.3,'Resource Management':.4,Hunting:.2,Horror:.2},
  rpg:{RPG:.95,'Action RPG':.5,'Open World':.6,Fantasy:.7,'Character Customization':.6,'Story Rich':.6,'Choices Matter':.4,Loot:.5,'Dark Fantasy':.3,'Souls-like':.25,'Third Person':.5,'Party-Based RPG':.2,CRPG:.15,'Turn-Based Combat':.2,JRPG:.15,Medieval:.3,Magic:.4,Exploration:.5},
  strategy:{Strategy:.95,'Grand Strategy':.3,'4X':.3,RTS:.3,'Turn-Based Strategy':.4,Historical:.4,War:.4,Military:.3,Diplomacy:.3,Wargame:.25,'Real-Time':.3,Tactical:.4,Economy:.4,Simulation:.3,'Base Building':.2,'Turn-Based':.4,Space:.2},
  sim:{Simulation:.95,Management:.6,Building:.6,'City Builder':.3,Economy:.5,Automation:.3,'Base Building':.3,Sandbox:.5,Relaxing:.4,Realistic:.4,Driving:.2,'Farming Sim':.2,'Life Sim':.2,'Resource Management':.5,'Colony Sim':.2,Physics:.3,Space:.2},
  puzzle:{Puzzle:.95,Logic:.5,'Puzzle Platformer':.3,Physics:.3,Relaxing:.4,Casual:.6,Minimalist:.3,Cute:.3,'2D':.5,'Co-op':.3,'Local Co-Op':.3,Short:.3,'Point & Click':.2,'Hidden Object':.1,'Family Friendly':.4,Colorful:.5},
  moba:{MOBA:.8,Competitive:.9,PvP:.9,eSports:.7,'Team-Based':.9,Strategy:.5,'Action RTS':.4,Multiplayer:.95,'Hero Shooter':.2,'Card Game':.2,Fantasy:.4},
  roguelike:{Roguelike:.7,Roguelite:.8,'Procedural Generation':.8,'Action Roguelike':.5,Deckbuilding:.3,'Card Game':.25,Difficult:.6,'Pixel Graphics':.4,'2D':.6,'Replay Value':.8,'Dungeon Crawler':.4,Indie:.8,'Top-Down':.4,'Bullet Hell':.3},
  horror:{Horror:.95,'Psychological Horror':.6,'Survival Horror':.5,Dark:.7,Atmospheric:.8,'Co-op':.4,'Online Co-Op':.4,'First-Person':.6,Mystery:.4,Thriller:.3,Gore:.3,Zombies:.2},
  racing:{Racing:.6,Sports:.5,Driving:.6,'Automobile Sim':.3,Simulation:.5,Realistic:.6,'Football (Soccer)':.2,Competitive:.4,Arcade:.3,Controller:.6,Physics:.3},
  sandbox:{Sandbox:.9,Building:.8,Crafting:.7,'Open World':.6,Survival:.5,Voxel:.4,Multiplayer:.7,'Family Friendly':.4,Exploration:.6,'Procedural Generation':.5}
};
const RARE=['Anime','Cartoony','Stylized','Cyberpunk','Steampunk','Pirates','Ninja','Vampire','Mechs','Robots','Aliens','Dinosaurs','Dragons','Cats','Underwater',
  'Naval','Trains','Flight','Space Sim','Hacking','Stealth','Parkour','Hack and Slash','Beat \'em up','Fighting','Martial Arts','Platformer','Metroidvania','Side Scroller',
  'Isometric','Top-Down Shooter','Twin Stick Shooter','Rhythm','Music','Narration','Detective','Investigation','Noir','Comedy','Satire','Memes','Philosophical','Emotional',
  'Lore-Rich','Nonlinear','Multiple Endings','Time Manipulation','Inventory Management','Trading','Capitalism','Political','Alternate History','World War II','Cold War',
  'Medieval','Mythology','Lovecraftian','Supernatural','Psychedelic','Surreal','Dark Humor','Mature','Blood','Cinematic','Photo Mode','Level Editor','Asynchronous Multiplayer',
  'Split Screen','4 Player Local','Massively Multiplayer','Social Deduction','Party Game','Board Game','Chess','Tower Defense','Idler','Clicker','Hex Grid','Grid-Based Movement'];
const MIX={
  Overall:{shooter:3,survival:2,rpg:2.5,strategy:1,sim:1,puzzle:.3,moba:1,roguelike:1,horror:1,racing:.7,sandbox:1},
  Puzzle:{puzzle:6,horror:.6,roguelike:.6,sim:.5,sandbox:.3},
  RPG:{rpg:6,survival:1,roguelike:1,strategy:.5,shooter:.5,sandbox:.3},
  Strategy:{strategy:6,sim:1.5,moba:.7,roguelike:.5,rpg:.5},
  Simulation:{sim:6,racing:1.5,survival:1,sandbox:1,strategy:.5}
};
const DEFINING={Overall:null,Puzzle:'Puzzle',RPG:'RPG',Strategy:'Strategy',Simulation:'Simulation'};
const DS_NAMES=Object.keys(MIX);

function pickWeighted(rng,obj){const e=Object.entries(obj);let r=rng()*e.reduce((a,x)=>a+x[1],0);for(const [k,w] of e){r-=w;if(r<=0)return k}return e[e.length-1][0]}
function genDataset(name,seed){
  const rng=mulberry32(seed),games=[];
  for(let r=1;r<=100;r++){
    const a1=pickWeighted(rng,MIX[name]),archs=[a1];
    if(rng()<.35){const a2=pickWeighted(rng,MIX[name]);if(a2!==a1)archs.push(a2)}
    const isFree=rng()<(archs.includes('moba')?.8:.15);
    const sc=new Map(),add=(t,s)=>{if(!sc.has(t)||sc.get(t)<s)sc.set(t,s)};
    archs.forEach((a,i)=>{for(const [t,p] of Object.entries(ARCH[a]))if(rng()<p)add(t,(i?1.2:1.6)*p*(.5+rng()))});
    for(const [t,p] of Object.entries(GENERIC))if(rng()<p)add(t,p*(.3+rng()));
    const nr=Math.floor(rng()*5);for(let k=0;k<nr;k++)add(RARE[Math.floor(rng()*RARE.length)],.2*rng());
    if(isFree)add('Free to Play',.3+1.5*rng());
    const def=DEFINING[name];if(def)add(def,.5+rng());
    let tags=[...sc.entries()].sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
    if(def&&tags.indexOf(def)>=20){tags.splice(tags.indexOf(def),1);tags.splice(19,0,def)}
    tags=tags.slice(0,20);
    games.push({appid:900000+seed*1000+r,name:`Mock Game ${name[0]}${String(r).padStart(3,'0')}`,rank:r,
      mmp:Math.round(250000*Math.exp(-(r-1)/18))+900-r,months:rng()<.72?60:2+Math.floor(rng()*58),is_free:isFree,tags});
  }
  return games;
}
const DATA={};DS_NAMES.forEach((n,i)=>DATA[n]=genDataset(n,i+1));

// ============================================================ graph algorithms
function louvain(n,edges,seed,gamma=1){
  const rng=mulberry32(seed);
  let adj=Array.from({length:n},()=>new Map());
  for(const e of edges){adj[e.s].set(e.t,(adj[e.s].get(e.t)||0)+e.w);adj[e.t].set(e.s,(adj[e.t].get(e.s)||0)+e.w)}
  let mem=[...Array(n).keys()];
  for(;;){
    const N=adj.length,k=adj.map(m=>{let s=0;for(const v of m.values())s+=v;return s}),m2=k.reduce((a,b)=>a+b,0);
    if(!m2)break;
    const comm=[...Array(N).keys()],tot=k.slice(),order=[...Array(N).keys()];
    let movedAny=false,moved=true,guard=0;
    while(moved&&guard++<100){
      moved=false;shuffle(order,rng);
      for(const i of order){
        const ci=comm[i],kin=new Map();
        for(const [j,w] of adj[i]){if(j!==i)kin.set(comm[j],(kin.get(comm[j])||0)+w)}
        tot[ci]-=k[i];
        let best=ci,bg=(kin.get(ci)||0)-gamma*tot[ci]*k[i]/m2;
        for(const [c,w] of kin){const g=w-gamma*tot[c]*k[i]/m2;if(g>bg+1e-10){bg=g;best=c}}
        tot[best]+=k[i];comm[i]=best;
        if(best!==ci){moved=true;movedAny=true}
      }
    }
    if(!movedAny)break;
    const map=new Map();comm.forEach(c=>{if(!map.has(c))map.set(c,map.size)});
    const na=Array.from({length:map.size},()=>new Map());
    for(let i=0;i<N;i++){const a=map.get(comm[i]);for(const [j,w] of adj[i]){const b=map.get(comm[j]);na[a].set(b,(na[a].get(b)||0)+w)}}
    mem=mem.map(x=>map.get(comm[x]));adj=na;
  }
  return mem;
}
function modularity(n,edges,comm,gamma=1){
  const k=new Array(n).fill(0);let m=0;const inW=new Map(),tot=new Map();
  for(const e of edges){k[e.s]+=e.w;k[e.t]+=e.w;m+=e.w;if(comm[e.s]===comm[e.t])inW.set(comm[e.s],(inW.get(comm[e.s])||0)+e.w)}
  if(!m)return null;
  for(let i=0;i<n;i++)tot.set(comm[i],(tot.get(comm[i])||0)+k[i]);
  let Q=0;for(const [c,t] of tot)Q+=(inW.get(c)||0)/m-gamma*(t/(2*m))**2;return Q;
}
// silhouette over Jaccard distance of game sets; idx maps local -> row of D (size N)
function silhouette(idx,comm,D,N){
  const groups=new Map();idx.forEach((g,i)=>{const c=comm[i];if(!groups.has(c))groups.set(c,[]);groups.get(c).push(i)});
  const per=new Array(idx.length).fill(null);
  let singles=0;for(const g of groups.values())if(g.length===1)singles++;
  if(groups.size-singles<1||groups.size<2)return{value:null,status:groups.size<2?'unavailable: fewer than 2 clusters':'unavailable: all clusters are singletons',singletons:singles,per};
  const gl=[...groups.entries()];let sum=0,cnt=0;
  for(let i=0;i<idx.length;i++){
    const own=groups.get(comm[i]);if(own.length<2)continue;
    const row=idx[i]*N;let a=0;for(const j of own)if(j!==i)a+=D[row+idx[j]];a/=own.length-1;
    let b=Infinity;for(const [c,mem] of gl){if(c===comm[i])continue;let s=0;for(const j of mem)s+=D[row+idx[j]];b=Math.min(b,s/mem.length)}
    const s=(b-a)/Math.max(a,b)||0;per[i]=s;sum+=s;cnt++;
  }
  return{value:cnt?sum/cnt:null,status:'ok',singletons:singles,per};
}

// ============================================================ state + network build
const S={mode:'graph',layoutMode:'global',panels:{controls:true,inspector:true,tables:true},dataset:'Overall',minGames:8,minShared:8,minMonths:0,hideGenre:true,hiddenGenre:new Set(GENRE_TAGS),hideDefining:true,
  keepIsolates:true,seed:42,removed:new Set(),selection:null,sens:null,sensJob:null};
let NET=null;
const PALETTE=['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#86bcb6','#d37295','#8cd17d'];

function netKey(){return JSON.stringify([S.dataset,S.minGames,S.minShared,S.minMonths,S.hideGenre,[...S.hiddenGenre].sort(),S.hideDefining,S.keepIsolates,S.seed,[...S.removed].sort()])}

function buildNetwork(){
  const games=DATA[S.dataset].filter(g=>g.months>=S.minMonths);
  const tagGames=new Map();games.forEach(g=>g.tags.forEach(t=>{if(!tagGames.has(t))tagGames.set(t,[]);tagGames.get(t).push(g)}));
  const def=DEFINING[S.dataset],dropped=[];let cand=[];
  for(const [t,gs] of tagGames){
    const c=gs.length;
    if(S.removed.has(t))dropped.push({tag:t,count:c,reason:'removed manually'});
    else if(def&&S.hideDefining&&t===def)dropped.push({tag:t,count:c,reason:'defining tag hidden'});
    else if(S.hideGenre&&S.hiddenGenre.has(t))dropped.push({tag:t,count:c,reason:'Genre Tag hidden'});
    else if(c<S.minGames)dropped.push({tag:t,count:c,reason:'below min games per tag'});
    else cand.push(t);
  }
  cand.sort();
  let idx=new Map(cand.map((t,i)=>[t,i]));const pair=new Map();
  for(const g of games){
    const ts=g.tags.filter(t=>idx.has(t)).map(t=>idx.get(t)).sort((a,b)=>a-b);
    for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){const k=ts[i]*100000+ts[j];if(!pair.has(k))pair.set(k,[]);pair.get(k).push(g)}
  }
  let edges=[];for(const [k,apps] of pair)if(apps.length>=S.minShared)edges.push({s:Math.floor(k/100000),t:k%100000,w:apps.length,apps});
  let tags=cand;
  if(!S.keepIsolates){
    const has=new Set();edges.forEach(e=>{has.add(e.s);has.add(e.t)});
    tags=cand.filter((t,i)=>{if(has.has(i))return true;dropped.push({tag:t,count:tagGames.get(t).length,reason:'no edge ≥ min shared'});return false});
    const re=new Map(tags.map((t,i)=>[t,i]));edges=edges.map(e=>({...e,s:re.get(cand[e.s]),t:re.get(cand[e.t])}));
  }
  const n=tags.length;
  // Jaccard distance on game sets
  const sets=tags.map(t=>new Set(tagGames.get(t).map(g=>g.appid)));
  const D=new Float32Array(n*n);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let inter=0;for(const a of sets[i])if(sets[j].has(a))inter++;const d=1-inter/(sets[i].size+sets[j].size-inter);D[i*n+j]=D[j*n+i]=d}
  const raw=louvain(n,edges,S.seed);
  const wdeg=new Array(n).fill(0),deg=new Array(n).fill(0),intra=new Array(n).fill(0);
  for(const e of edges){wdeg[e.s]+=e.w;wdeg[e.t]+=e.w;deg[e.s]++;deg[e.t]++;if(raw[e.s]===raw[e.t]){intra[e.s]+=e.w;intra[e.t]+=e.w}}
  const groups=new Map();raw.forEach((c,i)=>{if(!groups.has(c))groups.set(c,[]);groups.get(c).push(i)});
  const count=i=>tagGames.get(tags[i]).length;
  let clusters=[...groups.values()].map(members=>{
    const center=members.slice().sort((a,b)=>intra[b]-intra[a]||count(b)-count(a)||tags[a].localeCompare(tags[b]))[0];
    return{members,center};
  });
  clusters.sort((a,b)=>b.members.length-a.members.length||tags[a.center].localeCompare(tags[b.center]));
  const comm=new Array(n);
  clusters.forEach((c,ci)=>{c.label='C'+(ci+1);c.color=c.members.length>1?(PALETTE[ci]||'#9ca3af'):'#d1d5db';c.members.forEach(m=>comm[m]=ci);
    c.members.sort((a,b)=>intra[b]-intra[a]||tags[a].localeCompare(tags[b]))});
  const Q=modularity(n,edges,comm);
  const sil=silhouette([...Array(n).keys()],comm,D,n);
  clusters.forEach(c=>{
    let iw=0,ie=0;for(const e of edges)if(comm[e.s]===comm[e.t]&&comm[e.s]===clusters.indexOf(c)){iw+=e.w;ie++}
    const sz=c.members.length;c.intraW=iw;c.density=sz>1?ie/(sz*(sz-1)/2):null;
    const ss=c.members.map(m=>sil.per[m]).filter(x=>x!==null);c.meanSil=ss.length?ss.reduce((a,b)=>a+b,0)/ss.length:null;
  });
  let tw=0,iw=0;edges.forEach(e=>{tw+=e.w;if(comm[e.s]===comm[e.t])iw+=e.w});
  NET={key:netKey(),games,tagGames,tags,n,edges,comm,clusters,Q,sil,wdeg,deg,intra,D,coverage:tw?iw/tw:null,
    dropped:dropped.sort((a,b)=>b.count-a.count),totalTags:tagGames.size,isolates:deg.filter(d=>d===0).length,
    tagIndex:new Map(tags.map((t,i)=>[t,i]))};
  // drop a selection that no longer exists
  const sel=S.selection;
  if(sel&&((sel.type==='node'&&!NET.tagIndex.has(sel.id))||(sel.type==='edge'&&!findEdge(sel.id))||(sel.type==='cluster'&&!NET.clusters.find(c=>c.label===sel.id))))S.selection=null;
}
const edgeId=e=>NET.tags[e.s]+' — '+NET.tags[e.t];
function findEdge(id){return NET.edges.find(e=>edgeId(e)===id)}

// ============================================================ sensitivity (remove-and-recluster, on demand)
async function runSensitivity(){
  const net=NET,job={done:0,total:net.n,cancel:false,stage:'seed-noise floor'};S.sensJob=job;fill('sens');
  const qs=[],ss=[];
  for(let k=1;k<=10;k++){const c=louvain(net.n,net.edges,S.seed+k);qs.push(modularity(net.n,net.edges,c));ss.push(silhouette([...Array(net.n).keys()],c,net.D,net.n).value);await tick()}
  const sd=a=>{a=a.filter(x=>x!==null);if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
  const noise={q:sd(qs),s:sd(ss)};job.stage='removing nodes';
  const rows=[];
  for(let v=0;v<net.n;v++){
    if(job.cancel)break;
    const keep=[...Array(net.n).keys()].filter(i=>i!==v),re=new Map(keep.map((g,i)=>[g,i]));
    const es=net.edges.filter(e=>e.s!==v&&e.t!==v).map(e=>({s:re.get(e.s),t:re.get(e.t),w:e.w}));
    const c=louvain(keep.length,es,S.seed),Q=modularity(keep.length,es,c),sl=silhouette(keep,c,net.D,net.n).value;
    const k=new Set(c).size;
    rows.push({tag:net.tags[v],cluster:net.clusters[net.comm[v]].label,dSil:sl===null||net.sil.value===null?null:sl-net.sil.value,
      dQ:Q===null||net.Q===null?null:Q-net.Q,dK:k-net.clusters.length});
    job.done=v+1;if(v%2===0){fill('sens');await tick()}
  }
  rows.forEach(r=>{r.beyond=(noise.s!==null&&r.dSil!==null&&Math.abs(r.dSil)>2*noise.s)||(noise.q!==null&&r.dQ!==null&&Math.abs(r.dQ)>2*noise.q)});
  S.sens={key:net.key,rows,noise,complete:!job.cancel,at:new Date().toISOString()};S.sensJob=null;refresh();
}
const tick=()=>new Promise(r=>setTimeout(r,0));

const SORT={};
function table(el,key,cols,rows,{onRow,filter=true,height}={}){
  const st=SORT[key]||(SORT[key]={col:null,dir:-1,q:''});
  el.innerHTML=(filter?`<input class="tblfilter" placeholder="Filter…" value="${esc(st.q)}">`:'')+`<div class="tblwrap" ${height?`style="max-height:${height}"`:''}><table></table></div>`;
  const tbl=el.querySelector('table');
  const draw=()=>{
    let rs=rows;
    if(st.q){const q=st.q.toLowerCase();rs=rs.filter(r=>cols.some(c=>String(r[c.k]??'').toLowerCase().includes(q)))}
    if(st.col){const c=cols.find(c=>c.k===st.col);rs=rs.slice().sort((a,b)=>{const x=a[st.col],y=b[st.col];if(x===null)return 1;if(y===null)return-1;return(typeof x==='number'?x-y:String(x).localeCompare(String(y)))*st.dir})}
    tbl.innerHTML=`<thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}" data-k="${c.k}">${c.label}${st.col===c.k?(st.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${
      rs.map((r,i)=>`<tr class="${onRow?'click':''}" data-i="${rows.indexOf(r)}">${cols.map(c=>`<td class="${c.num?'num':''}">${c.html?c.html(r):esc(fmt(r[c.k],c.d))}</td>`).join('')}</tr>`).join('')}</tbody>`;
    tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.col===k)st.dir*=-1;else{st.col=k;st.dir=-1}draw()});
    if(onRow)tbl.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=ev=>{if(ev.target.closest('a'))return;onRow(rows[+tr.dataset.i])});
  };
  if(filter)el.querySelector('.tblfilter').oninput=e=>{st.q=e.target.value;draw()};
  draw();
}

    const c=el.querySelector('#s-cancel');if(c)c.onclick=()=>{job.cancel=true};
  },
  exports(el){
    const items=[['network.json','Network (JSON)'],['nodes.csv','Node stats (CSV)'],['edges.csv','Edges + AppIDs (CSV)'],['clusters.csv','Cluster summary (CSV)'],
      ['quality.json','Cluster quality (JSON)'],['sensitivity.csv','Node sensitivity (CSV)'],['dropped.csv','Tags not in network (CSV)']];
    el.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:4px">${items.map(([f,l])=>`<button data-exp="${f}">${l}</button>`).join('')}</div>
      <div class="note" style="margin-top:4px">Every file carries dataset, thresholds, hidden/removed tags, seed and timestamp (schemas: open, see map fog).</div>`;
    el.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>doExport(b.dataset.exp));
  }
};

// ============================================================ exports
function meta(){return{prototype:true,mock_data:true,exported_at:new Date().toISOString(),dataset:S.dataset,algorithm:'louvain',gamma:1,seed:S.seed,
  min_games_per_tag:S.minGames,min_shared_games:S.minShared,min_months:S.minMonths,hide_genre_tags:S.hideGenre,genre_tag_list:[...S.hiddenGenre],
  hide_defining_tag:S.hideDefining,keep_isolates:S.keepIsolates,removed_nodes:[...S.removed],edge_weight:'raw shared-game count'}}
function csv(rows){if(!rows.length)return'';const k=Object.keys(rows[0]),q=v=>{v=v===null||v===undefined?'':String(v);return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return[k.join(','),...rows.map(r=>k.map(x=>q(r[x])).join(','))].join('\n')}
function doExport(f){
  const N=NET,m=meta();let txt;
  const nodes=N.tags.map((t,i)=>({tag:t,games:N.tagGames.get(t).length,cluster:N.clusters[N.comm[i]].label,is_center:N.clusters[N.comm[i]].center===i,degree:N.deg[i],weighted_degree:N.wdeg[i],silhouette:N.sil.per[i]}));
  if(f==='network.json')txt=JSON.stringify({metadata:m,nodes,edges:N.edges.map(e=>({source:N.tags[e.s],target:N.tags[e.t],weight:e.w,appids:e.apps.map(g=>g.appid)}))},null,1);
  else if(f==='quality.json')txt=JSON.stringify({metadata:m,modularity:N.Q,silhouette:N.sil.value,silhouette_status:N.sil.status,singletons:N.sil.singletons,coverage:N.coverage,clusters:N.clusters.length},null,1);
  else{
    const rows={'nodes.csv':nodes,'edges.csv':N.edges.map(e=>({tag_a:N.tags[e.s],tag_b:N.tags[e.t],shared_games:e.w,appids:e.apps.map(g=>g.appid).join(';')})),
      'clusters.csv':N.clusters.map(c=>({cluster:c.label,size:c.members.length,center:N.tags[c.center],intra_weight:c.intraW,density:c.density,mean_silhouette:c.meanSil,members:c.members.map(x=>N.tags[x]).join(';')})),
      'sensitivity.csv':S.sens&&S.sens.key===N.key?S.sens.rows.map(r=>({removed_tag:r.tag,cluster:r.cluster,d_silhouette:r.dSil,d_modularity:r.dQ,d_clusters:r.dK,beyond_noise:r.beyond})):null,
      'dropped.csv':N.dropped}[f];
    if(!rows){alert('Run node sensitivity for the current settings first.');return}
    txt='# '+JSON.stringify(m)+'\n'+csv(rows);
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=`PROTOTYPE_${S.dataset}_${f}`;a.click();
}

// ============================================================ graph view (Cytoscape.js; same JSON works in dash-cytoscape or a Panel JSComponent)
let cy=null,cyEl=null,layoutToken=0,lastGlobal=new Map();const LAYOUTS=new Map();
const COSE={name:'cose',randomize:false,animate:false,fit:false,nodeRepulsion:()=>9000,gravity:.5,numIter:1200,componentSpacing:60,nodeOverlap:10};
function updateGraph(rebuild){
  const el=document.querySelector('[data-slot=graph]');if(!el||typeof cytoscape==='undefined')return;
  const N=NET;
  if(!cy||cyEl!==el){
    if(cy)cy.destroy();cyEl=el;rebuild=true;
    cy=cytoscape({container:el,wheelSensitivity:.25,minZoom:.1,maxZoom:4});
    cy.on('tap','node',e=>select('node',e.target.id()));
    cy.on('tap','edge',e=>select('edge',e.target.id()));
    cy.on('tap',e=>{if(e.target===cy)select(null)});
  }
  if(rebuild){
    const cnt=N.tags.map(t=>N.tagGames.get(t).length),cmin=Math.min(...cnt,1),cmax=Math.max(...cnt,2),ws=N.edges.map(e=>e.w),wmax=Math.max(...ws,1),wmin=Math.min(...ws,1);
    const sc=(v,a,b,lo,hi)=>b>a?lo+(hi-lo)*(v-a)/(b-a):(lo+hi)/2;
    cy.batch(()=>{
      cy.elements().remove();
      cy.add(N.tags.map((t,i)=>{const c=N.clusters[N.comm[i]],isC=c.center===i&&c.members.length>1;
        return{group:'nodes',data:{id:t,label:t,color:c.color,size:sc(cnt[i],cmin,cmax,14,52)},classes:isC?'center':''}}));
      cy.add(N.edges.map(e=>({group:'edges',data:{id:edgeId(e),source:N.tags[e.s],target:N.tags[e.t],width:sc(e.w,wmin,wmax,.6,7)},classes:N.comm[e.s]!==N.comm[e.t]?'inter':''})));
    });
    cy.style([
      {selector:'node',style:{'background-color':'data(color)',width:'data(size)',height:'data(size)',label:'data(label)','font-size':9,'min-zoomed-font-size':7,
        'text-valign':'bottom','text-margin-y':2,color:'#333','border-width':1,'border-color':'#fff','z-index-compare':'manual','z-index':2}},
      {selector:'node.center',style:{shape:'diamond','border-width':3,'border-color':'#111','font-size':12,'font-weight':'bold','z-index':3,'min-zoomed-font-size':0}},
      {selector:'node.region',style:{shape:'round-rectangle',width:'data(w)',height:'data(h)','background-color':'data(color)','background-opacity':.07,
        'border-width':1.5,'border-color':'data(color)','border-opacity':.7,label:'data(label)','text-valign':'top','text-margin-y':20,'font-size':14,'font-weight':'bold',
        color:'#374151','min-zoomed-font-size':0,events:'no','z-index':0}},
      {selector:'edge',style:{width:'data(width)','line-color':'#9aa3b2',opacity:.28,'curve-style':'haystack','z-index-compare':'manual','z-index':1}},
      {selector:'edge.inter.dim',style:{opacity:.05}},
      {selector:'.faded',style:{opacity:.07}},
      {selector:'edge.hl',style:{opacity:.9,'line-color':'#334155'}},
      {selector:'node.hl',style:{opacity:1}},
      {selector:'node.sel',style:{'border-width':4,'border-color':'#2563eb'}},
      {selector:'edge.sel',style:{'line-color':'#2563eb',opacity:1}}
    ]);
    for(const k of [...LAYOUTS.keys()])if(!k.startsWith(N.key+'|'))LAYOUTS.delete(k);
    applyLayout();
  }
  applySelection();
}
function applySelection(){
  if(!cy)return;
  const els=cy.elements().not('.region');els.removeClass('faded hl sel');
  const sel=S.selection;if(!sel)return;
  let keep;
  if(sel.type==='node'){const n=cy.getElementById(sel.id);n.addClass('sel');keep=n.closedNeighborhood()}
  else if(sel.type==='edge'){const e=cy.getElementById(sel.id);e.addClass('sel');keep=e.union(e.connectedNodes())}
  else{const c=NET.clusters.find(c=>c.label===sel.id);const ns=cy.collection(c.members.map(m=>cy.getElementById(NET.tags[m])));keep=ns.union(ns.edgesWith(ns))}
  els.difference(keep).addClass('faded');keep.addClass('hl');
}
// Layout modes only move nodes: switching never rebuilds the network or reclusters. Positions are cached per (network, mode).
async function applyLayout(){
  const tok=++layoutToken,key=NET.key+'|'+S.layoutMode;
  cy.remove('.region');
  cy.edges('.inter').toggleClass('dim',S.layoutMode==='cluster');
  let L=LAYOUTS.get(key);
  if(!L){L=S.layoutMode==='global'?await globalLayout():await clusterLayout();if(!L||!cy||tok!==layoutToken)return;LAYOUTS.set(key,L)}
  cy.batch(()=>{
    cy.nodes().forEach(n=>{const p=L.pos.get(n.id());if(p)n.position(p)});
    cy.add(L.regions.map(r=>({group:'nodes',data:{id:'region:'+r.label,label:r.label,w:r.w,h:r.h,color:r.color},position:{x:r.x,y:r.y},classes:'region',grabbable:false,selectable:false})));
  });
  cy.resize();cy.fit(undefined,30);applySelection();
}
async function runCose(eles,opts){const l=eles.layout({...COSE,...opts}),p=l.promiseOn('layoutstop');l.run();await p}
async function globalLayout(){
  const rng=mulberry32(S.seed);
  cy.nodes().forEach(n=>n.position(lastGlobal.get(n.id())||{x:rng()*900,y:rng()*700}));
  await runCose(cy.elements(),{idealEdgeLength:()=>70});
  if(!cy)return null;
  const pos=new Map(cy.nodes().map(n=>[n.id(),{...n.position()}]));lastGlobal=pos;return{pos,regions:[]};
}
// Each multi-tag cluster is laid out on its own (intra-cluster edges only, seeded from the global positions so it keeps its
// internal shape), then the cluster boxes are shelf-packed without overlap; single-tag clusters share one grid box at the end.
async function clusterLayout(){
  const tok=layoutToken,rng=mulberry32(S.seed),N=NET,boxes=[],singles=[];
  for(const c of N.clusters){
    const ns=cy.collection(c.members.map(m=>cy.getElementById(N.tags[m])));
    if(ns.length===1){singles.push(ns[0]);continue}
    ns.forEach(n=>n.position(lastGlobal.get(n.id())||{x:rng()*400,y:rng()*400}));
    await runCose(ns.union(ns.edgesWith(ns)),{idealEdgeLength:()=>60,gravity:1,numIter:1000});
    if(!cy||tok!==layoutToken)return null;
    boxes.push({c,ns,bb:ns.boundingBox({includeLabels:true})});
  }
  const PAD=40,GAP=70,TOP=26,pos=new Map(),regions=[];
  const area=boxes.reduce((a,b)=>a+(b.bb.w+2*PAD)*(b.bb.h+2*PAD),0),rowW=Math.max(800,Math.sqrt(area)*1.5);
  let x=0,y=0,rowH=0;
  for(const b of boxes){
    const w=b.bb.w+2*PAD,h=b.bb.h+2*PAD+TOP;
    if(x>0&&x+w>rowW){x=0;y+=rowH+GAP;rowH=0}
    const dx=x+PAD-b.bb.x1,dy=y+PAD+TOP-b.bb.y1;
    b.ns.forEach(n=>{const p=n.position();pos.set(n.id(),{x:p.x+dx,y:p.y+dy})});
    regions.push({label:`${b.c.label} · ${b.c.members.length} tags`,color:b.c.color,x:x+w/2,y:y+h/2,w,h});
    x+=w+GAP;rowH=Math.max(rowH,h);
  }
  if(singles.length){
    if(boxes.length)y+=rowH+GAP;
    const SX=110,SY=70,cols=Math.max(1,Math.min(singles.length,Math.floor(rowW/SX))),rows=Math.ceil(singles.length/cols);
    singles.sort((a,b)=>a.id().localeCompare(b.id())).forEach((n,i)=>pos.set(n.id(),{x:PAD+(i%cols)*SX,y:y+PAD+TOP+Math.floor(i/cols)*SY}));
    const w=(cols-1)*SX+2*PAD,h=(rows-1)*SY+2*PAD+TOP+14;
    regions.push({label:`Single-tag clusters · ${singles.length}`,color:'#9ca3af',x:w/2,y:y+h/2,w,h});
  }
  return{pos,regions};
}

// ============================================================ modes (Graph workbench is the main interface; Analysis report is the second mode)
const TABS=[['quality','Cluster quality'],['clusters','Clusters'],['sens','Node sensitivity'],['nodes','Nodes'],['edges','Edges'],['dropped','Not in network']];
const tabsHtml=()=>`<nav>${TABS.map(([k,l],i)=>`<button data-tab="${k}" class="${i?'':'on'}">${l}</button>`).join('')}</nav>${TABS.map(([k],i)=>`<div data-panel="${k}" data-slot="${k}" ${i?'hidden':''}></div>`).join('')}`;
Object.assign(FILL,{
  mode(el){
    el.innerHTML=`<div class="seg">${Object.entries(MODES).map(([k,m])=>`<button data-mode="${k}" class="${S.mode===k?'on':''}">${m.name}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(S.mode!==b.dataset.mode){S.mode=b.dataset.mode;mount()}});
  },
  layout(el){
    el.innerHTML=`<div class="seg"><span class="note">Layout</span><button data-lm="global" class="${S.layoutMode==='global'?'on':''}">Global</button><button data-lm="cluster" class="${S.layoutMode==='cluster'?'on':''}">Cluster-separated</button></div>`;
    el.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{if(S.layoutMode===b.dataset.lm)return;S.layoutMode=b.dataset.lm;fill('layout');if(cy)applyLayout()});
  },
  panels(el){
    const P=S.panels,all=P.controls||P.inspector||P.tables;
    el.innerHTML=`<div class="seg">${[['controls','Controls'],['inspector','Inspector'],['tables','Tables']].map(([k,l])=>`<button data-p="${k}" class="${P[k]?'on':''}">${l}</button>`).join('')}</div>
      <button id="p-all">${all?'Graph only':'Show panels'}</button>`;
    el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{P[b.dataset.p]=!P[b.dataset.p];applyPanels()});
    el.querySelector('#p-all').onclick=()=>{const v=!all;P.controls=P.inspector=P.tables=v;applyPanels()};
  }
});
function applyPanels(){
  const root=document.querySelector('.vA');if(!root)return;
  root.classList.toggle('no-left',!S.panels.controls);root.classList.toggle('no-right',!S.panels.inspector);root.classList.toggle('no-bottom',!S.panels.tables);
  fill('panels');if(cy){cy.resize();cy.fit(undefined,30)}
}
const MODES={
  graph:{name:'Graph workbench',html:`<div class="vA">
      <header><b style="font-size:15px">Tag Network</b><span class="proto">PROTOTYPE · MOCK DATA</span><div data-slot="mode"></div><div data-slot="summary"></div><div class="hdr-r" data-slot="panels"></div></header>
      <aside class="left"><h3>Dataset &amp; filters</h3><div data-slot="controls"></div><h3>Removed nodes</h3><div data-slot="removed"></div><h3>Export</h3><div data-slot="exports"></div></aside>
      <main class="center"><div class="graph" data-slot="graph"></div><div class="layoutsw" data-slot="layout"></div><div data-slot="legend"></div></main>
      <aside class="right"><h3>Inspector <button class="x" id="a-x" title="Close">×</button></h3><div data-slot="inspector"></div></aside>
      <section class="bottom" data-tabs>${tabsHtml()}</section></div>`,
    after(){document.getElementById('a-x').onclick=()=>select(null);applyPanels()},
    refresh(){const r=document.querySelector('.vA');if(r)r.classList.toggle('has-sel',!!S.selection)}},
  report:{name:'Analysis report',html:`<div class="vC">
      <header><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h1>Tag Network</h1><span class="proto">PROTOTYPE · MOCK DATA</span><div data-slot="mode"></div></div>
        <p class="note">Read top to bottom: what was loaded, what was filtered out, the network, how good the clustering is, which tags it hinges on, then export.</p></header>
      <section><h2><span class="n">1</span>Dataset</h2><p class="lead">The pipeline's Top-100 export. Never modified here.</p><div class="two"><div data-slot="controls" data-part="dataset"></div><div data-slot="dsinfo"></div></div></section>
      <section><h2><span class="n">2</span>Filters</h2><p class="lead">Which games and tags enter the network. Every tag left out is listed with its reason.</p>
        <div data-slot="controls" data-part="filters"></div><div data-slot="summary" style="margin:8px 0"></div>
        <details><summary>Tags not in the network</summary><div data-slot="dropped"></div></details><h3>Removed nodes</h3><div data-slot="removed"></div></section>
      <section><h2><span class="n">3</span>Network</h2><p class="lead">Louvain clusters (colours, never named) with their centers (◆). Click anything to inspect it.</p>
        <div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap"><div data-slot="controls" data-part="cluster"></div><div data-slot="layout" style="margin-bottom:10px"></div></div>
        <div class="netgrid"><div><div class="graph" data-slot="graph"></div><div data-slot="legend"></div></div><div class="side" data-slot="inspector"></div></div></section>
      <section><h2><span class="n">4</span>Cluster quality</h2><p class="lead">Computed after every clustering.</p><div class="two"><div data-slot="quality"></div><div data-slot="clusters"></div></div></section>
      <section><h2><span class="n">5</span>Node sensitivity</h2><p class="lead">How much the clustering depends on each tag. Runs only when you press the button.</p><div data-slot="sens"></div></section>
      <section><h2><span class="n">6</span>All nodes and edges</h2><details><summary>Nodes</summary><div data-slot="nodes"></div></details><details><summary>Edges</summary><div data-slot="edges"></div></details></section>
      <section><h2><span class="n">7</span>Export</h2><div data-slot="exports"></div></section></div>`}
};

// ============================================================ wiring
function fill(slot){document.querySelectorAll(`[data-slot="${slot}"]`).forEach(el=>FILL[slot]&&FILL[slot](el))}
function refresh(opts={}){
  document.querySelectorAll('[data-slot]').forEach(el=>{const s=el.dataset.slot;if(s==='graph'||(s==='controls'&&!opts.controls))return;FILL[s]&&FILL[s](el)});
  updateGraph(opts.relayout);
  const m=MODES[S.mode];if(m.refresh)m.refresh();
  document.querySelectorAll('[data-sel]').forEach(a=>a.onclick=()=>select(a.dataset.sel,a.dataset.id));
}
function recompute(controls){buildNetwork();refresh({relayout:true,controls})}
let timer;function recomputeSoon(){clearTimeout(timer);timer=setTimeout(()=>recompute(false),180)}
function select(type,id){S.selection=type?{type,id}:null;refresh()}
function wireTabs(root){root.querySelectorAll('[data-tabs]').forEach(t=>{const bs=t.querySelectorAll(':scope > nav [data-tab]');
  bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.toggle('on',x===b));t.querySelectorAll(':scope > [data-panel]').forEach(p=>p.hidden=p.dataset.panel!==b.dataset.tab)})})}
function mount(){
  const m=MODES[S.mode],app=document.getElementById('app');
  if(cy){cy.destroy();cy=null}
  app.innerHTML=m.html;wireTabs(app);
  refresh({relayout:true,controls:true});
  if(m.after)m.after();
}

buildNetwork();mount();
</script>
