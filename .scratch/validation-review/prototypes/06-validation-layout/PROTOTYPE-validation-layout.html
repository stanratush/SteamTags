<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6eb;--line2:#eef0f3;--ink:#1b2130;--ink2:#3d4555;--mute:#6b7280;--faint:#9aa1ad;
 --acc:#2457d6;--acc-bg:#eef3ff;--warn:#9a5b00;--warn-bg:#fff6e5;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 var(--sans);color:var(--ink);background:#d9dce2;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.mute{color:var(--mute)}.small{font-size:12px}
/* ---------- prototype chrome (not part of the design) */
#proto{position:fixed;top:0;left:0;right:0;height:40px;z-index:100;background:#111;color:#eee;display:flex;gap:14px;
 align-items:center;padding:0 12px;font-size:12px;overflow-x:auto;white-space:nowrap}
#proto label{color:#aaa}
#proto .seg{display:inline-flex;border:1px solid #444;border-radius:6px;overflow:hidden}
#proto .seg button{background:none;border:0;color:#ccc;padding:3px 8px;cursor:pointer}
#proto .seg button.on{background:#f0c400;color:#111}
#switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:100;background:#111;color:#fff;
 border-radius:999px;padding:6px 8px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0006;font-size:13px}
#switcher button{background:#333;border:0;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
#stage{position:absolute;top:40px;left:0;right:0;bottom:0;overflow:auto;padding:10px}
#frame-label{font-size:11px;color:#555;margin:0 0 4px}
/* ---------- app mock */
.app{position:relative;background:var(--bg);border:1px solid #999;display:grid;overflow:hidden}
.app.wide{grid-template-columns:264px minmax(0,1fr) 380px}
.app.medium,.app.narrow{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.ctl{background:var(--panel);border-right:1px solid var(--line);padding:10px}
.pillbar{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:6px}
.pillbar span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mute)}
.stub{background:var(--line2);border-radius:6px;margin:6px 0;color:var(--faint);font-size:11px;padding:4px 8px}
.main{display:flex;flex-direction:column;gap:10px;overflow:auto;padding:8px 12px 60px;min-width:0;min-height:0}
.main>*{flex-shrink:0}  /* review item 1: every child of .ps-main keeps its height; the column scrolls */
.heat{height:460px;flex:0 0 460px;background:repeating-linear-gradient(45deg,#e9edf5 0 10px,#f2f4f9 10px 20px);
 border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--faint)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.insp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:4px 14px 60px}
.app.medium .insp,.app.narrow .insp{position:absolute;right:12px;top:52px;bottom:12px;width:380px;border:1px solid var(--line);
 border-radius:10px;box-shadow:0 12px 32px #0003;z-index:5}
.insp-title{display:flex;align-items:center;margin:6px 0}
.insp-title .x{margin-left:auto;border:0;background:none;font-size:16px;color:var(--mute)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
h4{font-size:15px;margin:4px 0 6px;display:flex;align-items:center;gap:6px}
h5{font-size:13px;margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.q{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid #b9c0cc;font-size:10px;
 color:var(--mute);cursor:help;font-weight:500;flex:none}
p{margin:4px 0}
.cav{font-style:italic;color:var(--ink2)}
.note{background:var(--warn-bg);border:1px solid #f0d8a8;color:var(--warn);border-radius:6px;padding:5px 8px;margin:4px 0}
.ps-badges{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.ps-badge{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.ps-badge.warn{border-color:#e0b25a;color:var(--warn);background:var(--warn-bg)}
.ps-badge.ok{border-color:#59a14f;color:#2f6b2a}
.ps-kv{font-size:12px;border-collapse:collapse;width:100%}
.ps-kv th{text-align:left;font-weight:500;padding:2px 8px 2px 0;vertical-align:top;width:42%}
.ps-kv td{padding:2px 0;vertical-align:top}
/* tables */
.tw{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;font-size:12px;margin:6px 0}
table.t th,table.t td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-weight:600;background:#fafbfc}
table.t th .sub{display:block;font-weight:400;color:var(--mute);font-size:10.5px}
table.t td .sub{display:block;color:var(--mute);font-size:11px}
table.t td.n,table.t th.n{text-align:right}
table.t .grp{text-align:center;border-bottom:2px solid var(--ink2)}
table.t .sep{border-left:2px solid var(--line)}
table.t .sticky{position:sticky;left:0;background:#fff;z-index:1}
table.t th.sticky{background:#fafbfc}
.cname b{font-weight:600}.cname .mem{color:var(--mute);font-size:11px;display:block;max-width:190px}
.chip{display:inline-block;font-size:11px;border-radius:9px;padding:0 7px;margin:1px 2px 1px 0;white-space:nowrap}
.chip.diss{background:#3d4555;color:#fff}
.chip.bord{border:1px dashed #9a5b00;color:var(--warn)}
.chip.na{background:#e3e6eb;color:var(--ink2)}
.flag{color:var(--warn);font-size:11px;display:block}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0}
.segc button{border:0;background:#fff;padding:3px 10px;cursor:pointer}
.segc button.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.row-c{display:grid;grid-template-columns:minmax(120px,1.3fr) 34px 170px minmax(120px,1fr);gap:8px;align-items:center;
 padding:4px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row-c:hover{background:#fafbfc}
.row-c.head{cursor:default;font-weight:600;font-size:11.5px;background:#fafbfc}
.detail{grid-column:1/-1;padding:4px 0 8px 12px;cursor:default}
.narrowfit .row-c{grid-template-columns:minmax(100px,1fr) 30px 150px;}
.narrowfit .row-c .st{grid-column:1/-1;padding-left:4px}
.strip{display:flex;gap:2px;align-items:center;margin:2px 0}
.strip i{width:12px;height:12px;border-radius:2px;background:#e3e6eb;display:inline-block}
.strip i.diss{background:#3d4555}.strip i.bord{outline:1.5px dashed #9a5b00;outline-offset:-2px}
.strip i.na{background:repeating-linear-gradient(45deg,#c9ced6 0 2px,#fff 2px 4px)}
.legend{font-size:11px;color:var(--mute)}
a{color:var(--acc);cursor:pointer}

function tx(s, v = {}) {
  let t = S.lang === "bg" && BG[s] !== undefined ? BG[s] : s;
  if (S.lang === "bg" && BG[s] === undefined) console.warn("missing bg:", s);
  return t.replace(/\{(\w+)\}/g, (_, k) => v[k] !== undefined ? v[k] : `{${k}}`);
}
function fx(x, d = 3) { if (x == null) return "—"; let s = x.toFixed(d).replace("-", "−"); return S.lang === "bg" ? s.replace(".", ",") : s; }
function pc(x) { return Math.round(x * 100) + "%"; }
const H = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const q = (title) => `<span class="q" title="${H(title)}">?</span>`;

// ---------------------------------------------------------------- state -> figures
function clusters() {
  const deep = JSON.parse(JSON.stringify(D.clusters));
  if (S.edge === "edge") {         // C15 not assessable in both arms, C14 rarely assessable
    for (const arm of ["reselected", "at_resolution"]) {
      const c15 = deep[arm][14]; Object.assign(c15, {b: 0, mean: null, se: null, p10: null, p90: null, diss: 0, diss_ci: null,
        rec: 0, rec_ci: null, status: "not_assessable", borderline: false, w_mean: 0.31, w_se: 0.012});
      const c14 = deep[arm][13]; Object.assign(c14, {b: 38, diss: 33, diss_ci: [0.72, 0.94], rarely: true});
    }
  }
  if (S.edge === "none") {
    for (const arm of ["reselected", "at_resolution"]) for (const c of deep[arm]) { c.status = null; c.borderline = false; }
  }
  return deep;
}
function nullFig() {
  const n = D.summary.null, r = n.replicates;
  const base = {r, d: r, u: 0, reasons: [], reach: 0, lo: n.q.min, hi: n.q.max, med: n.q.median,
    multi: n.n_multi, k: n.selected, width: n.width};
  if (S.nullq === "reached") Object.assign(base, {reach: 3, hi: 0.1552});
  if (S.nullq === "weak") Object.assign(base, {d: 40, u: 60, reasons: [["no_edges", 52], ["beyond_scan", 8]], k: 37,
    multi: {...n.n_multi, median: 11, min: 4, max: 17}, width: {...n.width, narrower: 30}});
  if (S.nullq === "undefined") Object.assign(base, {d: 0, u: r, reasons: [["no_edges", r]], k: 0});
  return base;
}
function reasonWords(rs) {
  return rs.map(([k, n]) => k === "no_edges" ? tx("{n} had no edges", {n}) : tx("{n} lay beyond their γ scan", {n})).join("; ");
}
const RES = () => fx(D.summary.resolution);

// ---------------------------------------------------------------- shared card pieces
function header() {
  let h = `<h4>${tx("Validation of g = {g}, s = {s}", {g: D.g, s: D.s})} ${q("selection.validate")}</h4>`;
  if (S.note === "other") h += `<p class="small mute">${tx("Validation ran for g = {g}, s = {s}, the pair chosen under the default constraints.", {g: D.g, s: D.s})}</p>`;
  if (S.note === "noq") h += `<p class="note small">${tx("No pair qualifies under your constraints, so this is the validation of g = {g}, s = {s}, the pair chosen under the default constraints.", {g: D.g, s: D.s})}</p>`;
  return h;
}
function nullHead() {
  const N = nullFig();
  return `<h5>${tx("Null Comparison")} ${q("selection.null")} <span class="mute" style="font-weight:400">${tx("({r} shuffled networks, per-pair procedure at g = {g}, s = {s})", {r: N.r, g: D.g, s: D.s})}</span></h5>`;
}
function nullProse() {
  const N = nullFig(), obs = D.summary.null.q.observed;
  let s = tx("Q at resolution {res} is {q};", {res: RES(), q: fx(obs)}) + " ";
  if (N.d === 0) s += tx("no shuffled network has edges, so Q cannot be compared.");
  else {
    s += N.reach ? tx("{k} of {d} shuffled networks with a Q reach it: Q not above the null", {k: N.reach, d: N.d})
                 : tx("none of the {d} shuffled networks with a Q reaches it (range over {d} shuffled networks: {lo} to {hi})", {d: N.d, lo: fx(N.lo), hi: fx(N.hi)});
    s += N.u ? "; " + reasonWords(N.reasons) + "." : ".";
  }
  let out = `<p>${s}</p>`;
  if (N.d > 0 && N.d < N.r / 2) out += `<p class="note small">⚠ ${tx("Most shuffled networks have no Q ({u} of {r}), so this comparison is weak.", {u: N.u, r: N.r})}</p>`;
  if (N.k) {
    out += `<p>${tx("Multi-Tag Clusters: observed {o}, median {m} (range over {k} shuffled networks with a Selected Partition: {lo} to {hi}).", {o: N.multi.observed, m: N.multi.median, k: N.k, lo: N.multi.min, hi: N.multi.max})}</p>`;
    out += `<p>${tx("Median domain width {m} vs observed {o}; observed wider than {n} of {k}.", {m: fx(N.width.median), o: fx(N.width.observed), n: N.width.narrower, k: N.k})} ${tx("Widths are upper bounds, conditional on the partitions the γ scan finds.")}</p>`;
  } else out += `<p>${tx("None of the {r} shuffled networks has a Selected Partition.", {r: N.r})}</p>`;
  return out + `<p class="cav small">${tx("This shows only that the network is not random, not that its Clusters are real.")}</p>`;
}
function nullTable() {
  const N = nullFig(), obs = D.summary.null.q.observed;
  let qcell;
  if (N.d === 0) qcell = tx("no shuffled network has edges, so Q cannot be compared.");
  else qcell = tx("range {lo} to {hi} over {d} with a Q", {lo: fx(N.lo), hi: fx(N.hi), d: N.d}) + (N.u ? `<span class="sub">${reasonWords(N.reasons)}</span>` : "");
  const rows = [[tx("Q at resolution {res}", {res: RES()}), fx(obs), qcell]];
  if (N.k) {
    rows.push([tx("Multi-Tag Clusters"), N.multi.observed, tx("median {m}, range {lo} to {hi} over {k} with a Selected Partition", {m: N.multi.median, lo: N.multi.min, hi: N.multi.max, k: N.k})]);
    rows.push([tx("Domain width") + " " + q("widths are upper bounds"), fx(N.width.observed), tx("median {m}; observed wider than {n} of {k}", {m: fx(N.width.median), n: N.width.narrower, k: N.k})]);
  }
  let verdict = N.d === 0 ? `<span class="ps-badge">${tx("Null Q undefined")}</span>` :
    N.reach ? `<span class="ps-badge warn">${tx("Q not above the null ({k} of {d})", {k: N.reach, d: N.d})}${N.d < N.r / 2 ? " ⚠" : ""}</span> ${q("selection.verdict.q_not_above_null")}` :
    `<span class="ps-badge ok">${tx("Q above all {d} shuffled networks", {d: N.d})}${N.d < N.r / 2 ? " ⚠" : ""}</span>`;
  let out = `<div class="ps-badges">${verdict}</div><div class="tw"><table class="t"><tr><th></th><th class="n">${tx("Observed")}</th><th>${tx("Shuffled networks")}</th></tr>` +
    rows.map(r => `<tr><th style="font-weight:500">${r[0]}</th><td class="n">${r[1]}</td><td>${r[2]}</td></tr>`).join("") + `</table></div>`;
  if (N.d > 0 && N.d < N.r / 2) out += `<p class="note small">⚠ ${tx("Most shuffled networks have no Q ({u} of {r}), so this comparison is weak.", {u: N.u, r: N.r})}</p>`;
  if (!N.k) out += `<p>${tx("None of the {r} shuffled networks has a Selected Partition.", {r: N.r})}</p>`;
  else out += `<p class="small mute">${tx("Widths are upper bounds, conditional on the partitions the γ scan finds.")}</p>`;
  return out + `<p class="cav small">${tx("This shows only that the network is not random, not that its Clusters are real.")}</p>`;
}
function subHead() {
  const sub = D.summary.subsample;
  return `<h5>${tx("Subsample Stability")} ${q("selection.subsample")} <span class="mute" style="font-weight:400">${tx("({t} random 80% subsets of the games, g′ = {g}, s′ = {s}).", {t: sub.subsamples, g: sub.g, s: sub.s})}</span></h5>`;
}
function ariProse() {
  const sub = D.summary.subsample, re = sub.reselected, at = sub.at_resolution;
  return `<p>${tx("Re-selected: median ARI {m} (10th–90th percentile: {lo} to {hi}) over {n} of {t} subsamples, on {e} of the tags.", {m: fx(re.ari.median, 2), lo: fx(re.ari.p10, 2), hi: fx(re.ari.p90, 2), n: sub.subsamples - re.degenerate, t: sub.subsamples, e: pc(re.edged_share_mean)})}
    ${tx("At resolution {res}: median ARI {m} (10th–90th percentile: {lo} to {hi}).", {res: RES(), m: fx(at.ari.median, 2), lo: fx(at.ari.p10, 2), hi: fx(at.ari.p90, 2)})}</p>`;
}
const cname = (c) => `<i>${c.label}</i>`;
function dissolvedProse() {
  const C = clusters(), re = C.reselected, at = C.at_resolution, n = re.length;
  const lab = (arr) => new Set(arr.filter(c => c.status === "dissolved").map(c => c.label));
  const R = lab(re), A = lab(at);
  const both = [...R].filter(x => A.has(x)), ro = [...R].filter(x => !A.has(x)), ao = [...A].filter(x => !R.has(x));
  const na = re.filter(c => c.status === "not_assessable").map(c => c.label);
  const list = (xs) => xs.map(x => `<i>${x}</i>`).join(", ");
  let out = "";
  if (R.size || A.size) {
    let parts = [];
    if (both.length) parts.push(`${tx("{k} of {n} Multi-Tag Clusters in both arms", {k: both.length, n})}: ${list(both)}`);
    if (ro.length) parts.push(`${tx("re-selected only")}: ${list(ro)}`);
    if (ao.length) parts.push(`${tx("at resolution only")}: ${list(ao)}`);
    out += `<p><b>${tx("Dissolved in most subsamples")}</b> ${tx("(Hennig's Jaccard ≤ 0.5 in more than half; the majority is this study's rule):")} ${parts.join("; ")}.</p>`;
  } else if (!na.length) out += `<p>${tx("No Multi-Tag Cluster is dissolved in most subsamples in either arm.")}</p>`;
  const bR = re.filter(c => c.borderline).map(c => c.label), bA = at.filter(c => c.borderline).map(c => c.label);
  if (bR.length || bA.length) {
    const bb = bR.filter(x => bA.includes(x)), br = bR.filter(x => !bA.includes(x)), ba = bA.filter(x => !bR.includes(x));
    let parts = [];
    if (bb.length) parts.push(`${list(bb)} ${tx("in both arms")}`);
    if (br.length) parts.push(`${tx("re-selected only")}: ${list(br)}`);
    if (ba.length) parts.push(`${tx("at resolution only")}: ${list(ba)}`);
    out += `<p>${tx("Borderline (the 95% Wilson interval contains ½):")} ${parts.join("; ")}.</p>`;
  }
  if (na.length) out += `<p>${tx("Not assessable (fewer than 2 of its tags survive in every subsample):")} ${list(na)}.</p>`;
  return out;
}

function nameCell(c) { return `<span class="cname"><b>${c.label}</b><span class="mem">${H(c.members.slice(0, 3).join(", ") + (c.members.length > 3 ? ", …" : ""))}</span></span>`; }

function fCell(k, b, ci) { return b === 0 ? `<span class="mute">—</span>` : `${tx("{k} of {n}", {k, n: b})}<span class="sub">${Math.round(ci[0] * 100)}–${pc(ci[1])}</span>`; }
function wCell(c) { return `${fx(c.w_mean)} ± ${fx(c.w_se)}`; }

  const sub = (a, b) => `${tx(a)}<span class="sub">${tx(b)}</span>`;
  const armHead = (sep) => `<th class="n${sep}">${sub("Hennig's J", "mean ± s.e.; 10th–90th pct")}</th><th class="n">${sub("≤ 0.5 in", "k of B*; 95% Wilson")}</th><th class="n">${sub("> 0.75 in", "k of B*; 95% Wilson")}</th><th class="n">${sub("Whole-Cluster J", "mean ± s.e.")}</th><th>${tx("Status")}</th>`;
  let h = `<div class="tw"><table class="t"><tr><th rowspan="2" class="sticky">${tx("Cluster")}</th><th rowspan="2" class="n">${tx("Size")} ${q("2–3-tag Clusters can take only a few Jaccard values")}</th>
    <th colspan="5" class="grp sep">${tx("Re-selected")}</th><th colspan="5" class="grp sep">${tx("At resolution {res}", {res: RES()})}</th></tr>
    <tr>${armHead(" sep")}${armHead(" sep")}</tr>`;
  C.reselected.forEach((r, i) => {
    const a = C.at_resolution[i];
    const arm = (c) => `<td class="n sep">${jCell(c)}</td><td class="n">${fCell(c.diss, c.b, c.diss_ci)}</td><td class="n">${fCell(c.rec, c.b, c.rec_ci)}</td><td class="n">${wCell(c)}</td><td>${statusChips(c)}</td>`;
    h += `<tr><td class="sticky">${nameCell(r)}</td><td class="n">${r.size}</td>${arm(r)}${arm(a)}</tr>`;
  });
  return h + `</table></div>`;
}
function cardA() {
  return header() + nullHead() + nullProse() + subHead() + ariProse() + dissolvedProse() + tableA() + footer();
}
// ---------------------------------------------------------------- variant B: arm selector
function tableB() {
  const C = clusters(), arm = S.arm, other = arm === "reselected" ? "at_resolution" : "reselected";
  const sub = (a, b) => `${tx(a)}<span class="sub">${tx(b)}</span>`;
  let h = `<div class="segc"><button data-arm="reselected" class="${arm === "reselected" ? "on" : ""}">${tx("Re-selected")}</button><button data-arm="at_resolution" class="${arm === "at_resolution" ? "on" : ""}">${tx("At resolution {res}", {res: RES()})}</button></div>
    <div class="tw"><table class="t"><tr><th>${tx("Cluster")}</th><th class="n">${tx("Size")} ${q("2–3-tag Clusters …")}</th><th class="n">${sub("Hennig's J", "mean ± s.e.; 10th–90th pct")}</th><th class="n">${sub("≤ 0.5 in", "k of B*; 95% Wilson")}</th><th class="n">${sub("> 0.75 in", "k of B*; 95% Wilson")}</th><th class="n">${sub("Whole-Cluster J", "mean ± s.e.")}</th><th>${tx("Status")}</th></tr>`;
  C[arm].forEach((c, i) => {
    const o = C[other][i];
    let diff = "";
    if ((c.status === "dissolved") !== (o.status === "dissolved"))
      diff = `<span class="sub mute">${c.status === "dissolved" ? tx(arm === "reselected" ? "not at resolution" : "not re-selected") : `${tx("Dissolved in most subsamples")} ${tx(arm === "reselected" ? "at resolution only" : "re-selected only")}`}</span>`;
    h += `<tr><td>${nameCell(c)}</td><td class="n">${c.size}</td><td class="n">${jCell(c)}</td><td class="n">${fCell(c.diss, c.b, c.diss_ci)}</td><td class="n">${fCell(c.rec, c.b, c.rec_ci)}</td><td class="n">${wCell(c)}</td><td>${statusChips(c)}${diff}</td></tr>`;
  });
  return h + `</table></div>`;
}
function cardB() {
  return header() + nullHead() + nullTable() + subHead() + ariProse() + dissolvedProse() + tableB() + footer();
}
// ---------------------------------------------------------------- variant C: interval plot
function whisker(r, a) {
  const W = 150, x = (v) => 6 + v * (W - 12);
  const one = (c, y, lab) => c.b === 0 ? `<text x="${x(0)}" y="${y + 3}" font-size="9" fill="#9aa1ad">${tx("Not assessable")}</text>` :
    `<text x="0" y="${y + 3}" font-size="8" fill="#9aa1ad">${lab}</text><line x1="${x(c.diss_ci[0])}" x2="${x(c.diss_ci[1])}" y1="${y}" y2="${y}" stroke="${c.status === "dissolved" ? "#3d4555" : "#9aa1ad"}" stroke-width="2"/>` +
    `<circle cx="${x(c.diss / c.b)}" cy="${y}" r="3.5" fill="${c.status === "dissolved" ? "#3d4555" : "#fff"}" stroke="${c.status === "dissolved" ? "#3d4555" : "#6b7280"}"/>`;
  return `<svg width="${W}" height="30" style="display:block"><rect x="${x(0)}" y="2" width="${x(1) - x(0)}" height="26" fill="#fafbfc"/>
    <line x1="${x(.5)}" x2="${x(.5)}" y1="0" y2="30" stroke="#c0392b" stroke-dasharray="2 2"/>${one(r, 9, "R")}${one(a, 21, "A")}</svg>`;
}
function listC() {
  const C = clusters();
  let h = `<p class="legend">${tx("Share of subsamples with Hennig's Jaccard ≤ 0.5, with its 95% Wilson interval. R = re-selected, A = at resolution.")} ${tx("Click a row for every figure.")}</p>
    <div class="row-c head"><span>${tx("Cluster")}</span><span>${tx("Size")}</span><span>≤ 0.5: 0 — ½ — 1</span><span class="st">${tx("Status")}</span></div>`;
  C.reselected.forEach((r, i) => {
    const a = C.at_resolution[i];
    let st = "";
    const sr = statusChips(r), sa = statusChips(a);
    st = sr === sa ? sr : `<span class="small mute">R</span> ${sr || "—"} <span class="small mute">A</span> ${sa || "—"}`;
    h += `<div class="row-c" data-c="${r.label}"><span>${nameCell(r)}</span><span>${r.size}</span>${whisker(r, a)}<span class="st">${st}${r.rarely ? `<span class="flag">⚑ ${tx("rarely assessable ({b} of {s})", {b: r.b, s: r.s})}</span>` : ""}</span>`;
    if (S.open.has(r.label)) {
      const row = (lab, c) => `<tr><td>${tx(lab)}</td><td class="n">${jCell(c)}</td><td class="n">${fCell(c.diss, c.b, c.diss_ci)}</td><td class="n">${fCell(c.rec, c.b, c.rec_ci)}</td><td class="n">${wCell(c)}</td></tr>`;
      const sub = (x, y) => `${tx(x)}<span class="sub">${tx(y)}</span>`;
      h += `<div class="detail"><table class="t"><tr><th>${tx("Arm")}</th><th class="n">${sub("Hennig's J", "mean ± s.e.; 10th–90th pct")}</th><th class="n">${sub("≤ 0.5 in", "k of B*; 95% Wilson")}</th><th class="n">${sub("> 0.75 in", "k of B*; 95% Wilson")}</th><th class="n">${sub("Whole-Cluster J", "mean ± s.e.")}</th></tr>${row("re-selected", r)}${row("at resolution", a)}</table><div class="small mute">${H(r.members.join(", "))}</div></div>`;
    }
    h += `</div>`;
  });
  return h;
}
function cardC() {
  return header() + nullHead() + nullProse() + subHead() + ariProse() + dissolvedProse() + listC() + footer();
}

// ---------------------------------------------------------------- Inspector Validation section
function nullBadge() {
  const N = nullFig(), weak = N.d > 0 && N.d < N.r / 2 ? " ⚠" : "";
  if (N.d === 0) return `<span class="ps-badge">${tx("Null Q undefined")}</span>`;
  if (N.reach) return `<span class="ps-badge warn">${tx("Q not above the null ({k} of {d})", {k: N.reach, d: N.d})}${weak}</span>${q("selection.verdict.q_not_above_null")}`;
  return `<span class="ps-badge">${tx("Q above all {d} shuffled networks", {d: N.d})}${weak}</span>`;
}
function validationSection() {
  let h = `<h5>${tx("Validation")} ${q("selection.validate")}</h5>`;
  if (S.insp === "not") return h + `<div class="ps-badges"><span class="mute">${tx("Not validated")}</span></div>
     <div style="display:flex;gap:6px;align-items:center"><button class="btn">${tx("Validate this pair")}</button><span class="small mute">${tx("About 3 min on 12 workers.")}</span></div>`;
  const C = clusters(), sub = D.summary.subsample;
  const nR = C.reselected.filter(c => c.status === "dissolved").length, nA = C.at_resolution.filter(c => c.status === "dissolved").length;
  const nB = C.reselected.filter(c => c.borderline).length;
  const ari = tx("median ARI re-selected {a}, at resolution {b}", {a: fx(sub.reselected.ari.median, 2), b: fx(sub.at_resolution.ari.median, 2)});
  if (S.variant === "A") return h + `<div class="ps-badges">${nullBadge()}<span class="ps-badge">${tx("Dissolved in most subsamples (re-selected): {n}", {n: nR})}</span></div><div class="small">${ari}</div>`;
  if (S.variant === "B") return h + `<table class="ps-kv"><tr><th>${tx("Null Comparison")}</th><td>${nullBadge()}</td></tr>
     <tr><th>${tx("Dissolved in most subsamples")}</th><td>${tx("re-selected {a}, at resolution {b} of {n}", {a: nR, b: nA, n: C.reselected.length})}${nB ? `<br><span class="mute">${tx("{n} borderline", {n: nB})}</span>` : ""}</td></tr>
     <tr><th>${tx("median ARI")}</th><td>${tx("re-selected {a}, at resolution {b} of {n}", {a: fx(sub.reselected.ari.median, 2), b: fx(sub.at_resolution.ari.median, 2), n: ""}).replace(/ (от|of) $/, "")}</td></tr></table>
     <a class="small" data-goto="card">${tx("Open the validation card")} ↓</a>`;
  const strip = (arr) => arr.map(c => `<i class="${c.status === "dissolved" ? "diss" : c.status === "not_assessable" ? "na" : ""} ${c.borderline ? "bord" : ""}" title="${c.label}"></i>`).join("");
  return h + `<div class="ps-badges">${nullBadge()}<span class="ps-badge">${tx("Dissolved in most subsamples (re-selected): {n}", {n: nR})}</span></div>
     <div class="strip"><span class="small mute" style="width:14px">R</span>${strip(C.reselected)}</div>
     <div class="strip"><span class="small mute" style="width:14px">A</span>${strip(C.at_resolution)}</div>
     <div class="small">${ari}</div><a class="small" data-goto="card">${tx("Open the validation card")} ↓</a>`;
}
function inspector() {
  return `<div class="insp-title"><b>${tx("Pair Inspector")}</b><button class="x">×</button></div>
    <button class="btn primary">${tx("Apply to Workbench")}</button> <span class="q">?</span>
    <h4>${tx("{d}: g = {g}, s = {s}", {d: "RPG", g: D.g, s: D.s})} ${q("selection.inspector")}</h4>
    <div class="ps-badges"><span class="ps-badge ok">✓ qualifies</span></div>
    <h5>${tx("Metrics")}</h5><div class="stub" style="height:220px">metrics + descriptive (stub)</div>
    <h5>CHAMP</h5><div class="stub" style="height:200px">CHAMP figure (stub)</div>
    <h5>${tx("Clusters")}</h5><div class="stub" style="height:160px">15 Multi-Tag Clusters (stub)</div>
    <div id="insp-val">${validationSection()}</div>`;
}

// ---------------------------------------------------------------- frame
function render() {
  const [w, form] = FORMS[S.form];
  const card = {A: cardA, B: cardB, C: cardC}[S.variant]();
  const main = `<div class="main" id="main"><div class="stub" style="height:56px">dataset strip + Pair Constraints bar (stub)</div>
     <div class="stub" style="height:28px">metric picker (stub)</div><div class="heat">g × s heatmap, 460 px, flex-shrink 0</div>
     <div class="stub" style="height:14px">heatmap key</div><div class="panel"><h4>${tx("Why this pair")}</h4><div class="stub" style="height:90px">(stub)</div></div>
     <div class="panel ${w <= 1280 && form === "wide" ? "narrowfit" : ""}" id="card">${card}</div></div>`;
  const ctl = form === "wide" ? `<div class="ctl"><div class="stub" style="height:300px">Controls (stub)</div></div>` : `<div class="pillbar"><span>Settings ▾</span><span>Run ▾</span><span>Export ▾</span></div>`;
  const insp = `<div class="insp" id="insp">${inspector()}</div>`;
  const fr = document.getElementById("frame");
  const keepM = document.getElementById("main")?.scrollTop, keepI = document.getElementById("insp")?.scrollTop;
  const h = Math.max(560, innerHeight - 40 - 20 - 18 - 4);
  fr.innerHTML = `<div class="app ${form}" style="width:${w}px;height:${h}px">${form === "wide" ? ctl + main + insp : ctl + main + insp}</div>`;
  if (form !== "wide") { fr.querySelector(".app").style.gridTemplateRows = "auto minmax(0,1fr)"; }
  document.getElementById("frame-label").textContent = `${S.form} — main column ${document.getElementById("main").clientWidth}px, Inspector 380px` + (form === "wide" ? " (docked)" : " (floating over the main column)");
  const m = document.getElementById("main"), i = document.getElementById("insp");
  if (keepM == null || render.jump) { m.scrollTop = document.getElementById("card").offsetTop - 8; i.scrollTop = i.scrollHeight; render.jump = false; }
  else { m.scrollTop = keepM; i.scrollTop = keepI; }
  document.querySelectorAll("[data-arm]").forEach(b => b.onclick = () => { S.arm = b.dataset.arm; render(); });
  document.querySelectorAll(".row-c[data-c]").forEach(r => r.onclick = (e) => { if (e.target.closest(".detail")) return; const c = r.dataset.c; S.open.has(c) ? S.open.delete(c) : S.open.add(c); render(); });
  document.querySelectorAll("[data-goto=card]").forEach(a => a.onclick = () => { m.scrollTop = document.getElementById("card").offsetTop - 8; });
  document.getElementById("vlabel").textContent = `${S.variant} (${VARIANTS[S.variant]})`;
  protoBar();
  const u = new URLSearchParams({variant: S.variant, lang: S.lang, form: S.form, nullq: S.nullq, edge: S.edge, note: S.note, insp: S.insp});
  try { history.replaceState(null, "", "?" + u); } catch (e) { /* data: snapshot in the preview pane */ }
}
function protoBar() {
  const seg = (key, opts) => `<label>${key}</label><span class="seg">${Object.entries(opts).map(([v, l]) => `<button data-k="${key}" data-v="${v}" class="${S[key] === v ? "on" : ""}">${l}</button>`).join("")}</span>`;
  document.getElementById("proto").innerHTML = "<b style='color:#f0c400'>PROTOTYPE</b>" +
    seg("lang", {en: "EN", bg: "BG (draft)"}) + seg("form", {wide1280: "wide 1280", wide1600: "wide 1600", medium1100: "medium 1100", narrow800: "narrow 800"}) +
    seg("nullq", {above: "above all", reached: "reached", undefined: "undefined", weak: "weak D<R/2"}) +
    seg("edge", {real: "real Clusters", edge: "+ not assessable / rarely", none: "none dissolved"}) +
    seg("note", {none: "no note", other: "custom: other pair", noq: "custom: no qualifying pair"}) +
    seg("insp", {validated: "inspected: validated", not: "not validated"});
  document.querySelectorAll("#proto button").forEach(b => b.onclick = () => { S[b.dataset.k] = b.dataset.v; render(); });
}
const keys = Object.keys(VARIANTS);
function cycle(d) { S.variant = keys[(keys.indexOf(S.variant) + d + keys.length) % keys.length]; render.jump = true; render(); }
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
addEventListener("keydown", (e) => { if (e.target.closest("input,textarea,[contenteditable]")) return; if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); });
addEventListener("resize", render);
render();
</script>
</body>
