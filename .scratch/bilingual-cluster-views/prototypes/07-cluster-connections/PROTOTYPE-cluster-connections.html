  under lift, and Overall at gamma = 2.5 for many Clusters; both layouts; dumped by dump_state.py into data.js, with
  ticket 06's columns computed prototype-only), switchable with ?variant=A|B|C and the bar at the bottom (<- ->).

                           a row opens the pair in the Inspector, with its links (rows select a link).
    B  Matrix            - the Cluster quality tab gets a cluster x cluster matrix (Ratio, or directional Share);
                           a row header ranks that Cluster, a cell opens the pair's links beside the matrix.

  row selects the link; tapping a between-Cluster link on the canvas offers its pair. Nothing is sent or laid out:
  every highlight restyles the elements already drawn (the state box shows the timing).
  Prototype shortcuts: English only, plain fit, no label culling, today's tag/cluster Inspector content is stubbed,

<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6eb;--line2:#eef0f3;--ink:#1b2130;--ink2:#3d4555;--mute:#6b7280;--faint:#9aa1ad;
 --acc:#2457d6;--acc-bg:#eef3ff;--warn:#9a5b00;--warn-bg:#fff6e5;--pair:#3b2f6b;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans)}
#top{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#top b{font-size:14px}#top .tag{background:#fde68a;color:#713f12;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
#wrap{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:#fff;border-bottom:1px solid var(--line)}
#cy{position:absolute;inset:0}
#tables{height:230px;flex:none;background:var(--panel);overflow:auto;padding:8px 12px 60px}
.vB #tables{height:330px}
#insp{width:360px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 14px 70px}
#insp .ih{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ov{position:absolute;z-index:5}
.ov-tr{top:10px;right:10px;display:flex;gap:6px;align-items:center}
.ov-bl{left:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 20px)}
.legend{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;background:#ffffffe6;padding:4px;border-radius:8px;box-shadow:0 1px 3px #0000001a}
.lchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:12px;padding:1px 8px 1px 6px;
 background:#fff;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer}
.lchip.on{border-color:var(--acc);background:var(--acc-bg)}
.lchip.static{cursor:default}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;vertical-align:-1px;margin-right:4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:#a9b1bf}.btn.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:3px 10px;font:inherit;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--acc);color:#fff}
select{font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:#fff}
.mute{color:var(--mute)}.small{font-size:11.5px}
a.lnk,.lnk{color:var(--acc);cursor:pointer;text-decoration:none}a.lnk:hover{text-decoration:underline}
/* inspector pieces, after view.py */
.i-title{margin:2px 0 0;font-size:15px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.i-sub{margin:0 0 8px;color:var(--mute)}
.i-h{margin:14px 0 4px;font-weight:650;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.i-h .cnt{text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute);margin-left:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12.5px}
.kv .k{color:var(--ink2)}.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--mute);font-size:11.5px}
.stub{border:1px dashed var(--line);border-radius:6px;padding:6px 8px;color:var(--faint);font-size:12px;margin:6px 0}
.ref{font-size:11.5px;color:var(--mute);margin:2px 0 6px}
.caution{font-size:11.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:5px 7px;margin:8px 0}
table.tl{border-collapse:collapse;width:100%;font-size:12.5px}
table.tl th{font-weight:600;color:var(--ink2);text-align:left;border-bottom:1px solid var(--line);padding:3px 4px;position:sticky;top:0;background:#fff}
table.tl td{padding:2px 4px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
table.tl .r{text-align:right}
table.tl tr.click{cursor:pointer}table.tl tr.click:hover td{background:#f3f6fd}
table.tl tr.on td{background:var(--acc-bg)}
table.tl tr.zero td{color:var(--faint)}
.bar{display:inline-block;width:46px;height:6px;background:var(--line2);border-radius:3px;position:relative;vertical-align:1px;margin-left:5px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pair);border-radius:3px}
.bar b{position:absolute;top:-2px;bottom:-2px;width:1px;background:#9aa1ad}
.back{font-size:12px;margin-bottom:6px;display:inline-block}
/* tables area */
.thead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.thead h3{margin:0;font-size:13px}
.split{display:flex;gap:16px;align-items:flex-start}
.split > .side{flex:1;min-width:260px;max-height:270px;overflow:auto}
/* matrix (B) */
table.mx{border-collapse:separate;border-spacing:2px;font-size:11.5px;font-variant-numeric:tabular-nums}
table.mx th{font-weight:600;color:var(--ink2);padding:0 3px;white-space:nowrap;cursor:pointer}
table.mx th.on{color:var(--acc)}
table.mx td{width:40px;height:26px;text-align:center;border-radius:4px;cursor:pointer;border:2px solid transparent}
table.mx td.diag{cursor:default;background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 4px,#fff 4px,#fff 8px);color:var(--faint)}
table.mx td.none{background:#fafafa;color:var(--faint);cursor:default}
table.mx td.cur{border-color:var(--acc)}
table.mx td.lit{box-shadow:inset 0 0 0 1px #2457d655}
/* cluster map card (C) */
#cmap{position:absolute;top:46px;right:10px;width:380px;z-index:7;background:#fffffff5;border:1px solid var(--line);border-radius:10px;
 box-shadow:0 4px 16px #0002;display:none;max-height:calc(100% - 60px);overflow:auto}
.vC #cmap{display:block}
#cmap .ch{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line2)}
#cmap .cb{padding:6px 10px 10px}
#cmap svg{display:block}
#cmap .bub{cursor:pointer}
#cmap .lk{cursor:pointer}
/* state box */
#state{position:absolute;top:10px;left:10px;z-index:6;background:#111827e8;color:#e5e7eb;font:11px/1.35 ui-monospace,Consolas,monospace;
 border-radius:8px;padding:6px 8px;max-width:340px;white-space:pre-wrap}
#state summary{cursor:pointer;color:#fde68a}
/* switcher */
#switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;
 background:#111827;color:#fff;border-radius:999px;padding:5px 8px;box-shadow:0 6px 20px #0005;font-weight:600}
#switcher button{background:#374151;color:#fff;border:0;border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:14px}
#switcher span{min-width:210px;text-align:center}
</style>
</head>

  const gs = groups();
  for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) { const r = row(gs[i], gs[j]); if (r && r.n) pairs.push(r); }
  pairs.sort((x, y) => (x.ratio ?? 0) - (y.ratio ?? 0));
  for (const r of pairs) {
    const [ax, ay] = pos[r.a], [bx, by] = pos[r.b], t = Math.min(1, (r.ratio ?? 0) / g);
    const on = cp && ((cp.a === r.a && cp.b === r.b) || (cp.a === r.b && cp.b === r.a));
    const touch = cc && (r.a === cc || r.b === cc);
    const op = on ? 1 : cc ? (touch ? 0.25 + 0.75 * t : 0.06) : cp ? 0.08 : 0.12 + 0.7 * t;
    s += `<g class="lk" data-pair="${r.a}|${r.b}"><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="transparent" stroke-width="12"/>` +
      `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${on ? SEL : PAIR}" stroke-opacity="${op}" stroke-width="${(0.6 + 7 * t).toFixed(2)}" stroke-linecap="round"/>` +
      `<title>${nameOf(r.a)} ↔ ${nameOf(r.b)}: ratio ${fR(r.ratio)} (γ = ${g}) · ${r.n} links</title></g>`;
    if (on || (touch && t > 0)) { const mx = (ax + bx) / 2, my = (ay + by) / 2;
      s += `<text x="${mx}" y="${my - 3}" font-size="10.5" text-anchor="middle" fill="${on ? SEL : PAIR}" stroke="#fff" stroke-width="3" paint-order="stroke" font-weight="600">${fR(r.ratio)}</text>`; }
  }
  for (const gg of gs) {
    const [x, y] = pos[gg], i = info(gg), on = cc === gg || (cp && (cp.a === gg || cp.b === gg));
    const fade = (cc && cc !== gg && !(row(cc, gg) || {}).n) || (cp && !on);
    s += `<g class="bub" ${gg !== POOL ? `data-cluster="${gg}"` : ""} opacity="${fade ? 0.35 : 1}"><circle cx="${x}" cy="${y}" r="${rad(gg)}" fill="${i.color}" stroke="${on ? SEL : "#fff"}" stroke-width="${on ? 3 : 1.5}"/>` +
      `<text x="${x}" y="${y + 3.5}" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">${gg === POOL ? "1·" + i.size : gg}</text>` +
      `<title>${esc(nameOf(gg))}: ${i.size} tags</title></g>`;
  }
  return s + `</svg>`;
}
function viewC() {
  const s = V.sel, cp = curPair(), cc = curCluster();
  let kind = "", body = `<div class="note">Inspector unchanged: tags, links and clusters as today. Cluster connections live in the Cluster map card.</div>`;
  if (s && s.kind === "cluster") { kind = "cluster"; body = clusterStub(s.id) + `<div class="i-h">Members</div><div class="stub">today's members table</div>`; }
  else if (s && s.kind === "pair") { kind = "pair"; body = pairTitle(s.a, s.b) + `<div class="note">The pair is shown in the Cluster map card.</div>`; }
  else if (s && s.kind === "edge") { kind = "link"; body = edgeView(); }
  else if (s && s.kind === "node") { kind = "tag"; body = nodeView(); }
  setInsp(kind, body);
  let below;
  if (cp) {

    below = `<div style="display:flex;justify-content:space-between;align-items:center"><a class="lnk small" data-clear="1">← all clusters</a></div>` +
      pairTitle(cp.a, cp.b) + pairSummary(cp.a, cp.b) + linksHead(cp.a, cp.b) + linksTable(cp.a, cp.b);
  } else if (cc) {
    below = `<div style="display:flex;justify-content:space-between;align-items:center"><a class="lnk small" data-clear="1">← all clusters</a></div>` +
      `<div class="i-h" style="margin-top:4px">${cc}'s connections <span class="cnt">by Connection Ratio</span></div>` + refLine() + rankingTable(cc, true);
  } else {
    const all = [];
    const gs = groups();
    for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++) { const r = row(gs[i], gs[j]); if (r && r.ratio) all.push(r); }
    all.sort((x, y) => y.ratio - x.ratio);
    below = `<div class="i-h" style="margin-top:4px">Most connected pairs <span class="cnt">by Connection Ratio · ${all.length} pairs with links</span></div>` + refLine() +
      `<table class="tl"><tr><th>Pair</th><th class="r">Ratio</th><th class="r">Links</th></tr>${all.slice(0, 6).map((r) =>
        `<tr class="click" data-pair="${r.a}|${r.b}"><td>${sw(info(r.a).color)}${esc(r.a)} ↔ ${sw(info(r.b).color)}${esc(r.b)}</td><td class="r">${fR(r.ratio)}${bar(r.ratio)}</td><td class="r">${r.n}</td></tr>`).join("")}</table>`;
  }
  const card = document.getElementById("cmap");
  card.innerHTML = `<div class="ch"><b>Cluster map</b><span class="mute small">width = Connection Ratio · γ = ${gamma()}</span>` +
    `<span style="flex:1"></span><button class="btn" id="cmap-t" title="Collapse or open (never resizes the canvas)">${V.mapOpen ? "–" : "+"}</button></div>` +
    (V.mapOpen ? `<div class="cb">${mapSvg()}${below}</div>` : "");
  document.getElementById("cmap-t").onclick = () => { V.mapOpen = !V.mapOpen; render(); };
  document.getElementById("tables").innerHTML = qualityHead() + connectionsGrid();
}

// ------------------------------------------------------------------ chrome
function setInsp(kind, body) {
  document.getElementById("insp-kind").textContent = kind ? "· " + kind : "";
  document.getElementById("insp-body").innerHTML = body;
}
function legend() {
  const cc = curCluster(), cp = curPair();
  document.getElementById("legend").innerHTML = `<span class="small mute" style="padding:0 4px">Key</span>` +
    multis().map((c) => `<span class="lchip ${cc === c.cluster || (cp && (cp.a === c.cluster || cp.b === c.cluster)) ? "on" : ""}" data-cluster="${c.cluster}" title="Select ${c.cluster}">${sw(c.color)}${c.cluster} · ${c.size}</span>`).join("") +
    (nOneTag() ? `<span class="lchip static">${sw(POOL_COLOR)}${nOneTag()} one-tag</span>` : "");
}
function renderState() {
  const s = V.sel;
  const sel = !s ? "none" : s.kind === "pair" ? `pair ${s.a} ↔ ${s.b}` : s.kind === "edge" ? `link ${s.id}${s.pair ? ` (in ${s.pair.a} ↔ ${s.pair.b})` : ""}` : `${s.kind} ${s.id}`;
  document.getElementById("state-body").textContent =
`variant   ${V.variant} (${VARIANTS[V.variant]})
state     ${V.ds} · ${st().state_id} · ${st().weight} · γ ${gamma()}
clusters  ${multis().length} multi-tag + ${nOneTag()} one-tag · ${st().connections.length} rows
layout    ${V.layout}
selection ${sel}
last highlight ${V.lastMs == null ? "–" : V.lastMs.toFixed(1) + " ms"} restyle · ${V.highlights} highlights · ${V.fits} fits
payloads sent ${V.payloadsSent} · layouts ${V.layoutsRun} (only dataset/layout changes)`;
}
function render() {
  document.body.className = "v" + V.variant;
  document.getElementById("vlabel").textContent = `${V.variant} (${VARIANTS[V.variant]})`;
  document.getElementById("gamma").textContent = `γ = ${gamma()} · ${st().weight === "lift" ? "Clustering Weight: lift" : "Clustering Weight: shared games"}`;
  legend();
  if (V.variant === "A") viewA(); else if (V.variant === "B") viewB(); else viewC();
  renderState();
}
// One delegated click handler: data-cluster selects a Cluster, data-pair a pair, data-edge a link.
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-cluster],[data-pair],[data-edge],[data-clear]");
  if (!el || el.closest("#switcher")) return;
  if (el.dataset.clear) return choose(null);
  if (el.dataset.edge) return pickEdge(el.dataset.edge, curPair());
  if (el.dataset.pair) { const [a, b] = el.dataset.pair.split("|"); return pickPair(a, b); }
  if (el.dataset.cluster && el.dataset.cluster !== POOL) choose({kind: "cluster", id: el.dataset.cluster});
});
function setVariant(v) {
  V.variant = v;
  const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u);
  highlight(false);
  render();
}
document.getElementById("prev").onclick = () => setVariant(KEYS[(KEYS.indexOf(V.variant) + KEYS.length - 1) % KEYS.length]);
document.getElementById("next").onclick = () => setVariant(KEYS[(KEYS.indexOf(V.variant) + 1) % KEYS.length]);
document.getElementById("fit").onclick = () => fitAll();
window.addEventListener("keydown", (ev) => {
  if (ev.target.closest && ev.target.closest("input,textarea,select,[contenteditable]")) return;
  if (ev.key === "ArrowLeft") document.getElementById("prev").click();
  if (ev.key === "ArrowRight") document.getElementById("next").click();
  if (ev.key === "Escape") choose(null);
});
const ds = document.getElementById("ds");
const DSNAME = {overall: "Overall", puzzle: "Puzzle", "overall-lift": "Overall · Lift weight", "overall-g25": "Overall · γ = 2.5 (many clusters)"};
ds.innerHTML = Object.keys(D.states).map((k) => `<option value="${k}">${DSNAME[k] || k}</option>`).join("");
ds.onchange = () => { V.ds = ds.value; V.sel = null; load(); };
document.querySelectorAll("#lay button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("#lay button").forEach((x) => x.classList.toggle("on", x === b));
  V.layout = b.dataset.v; load();   // a pair or cluster selection survives a layout switch
  if (V.sel) { highlight(false); render(); }
});
mount();
load();
V.payloadsSent = 1; V.layoutsRun = 1; renderState();
</script>
</body>
